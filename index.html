<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column like a training notebook; sticky bar with three tabs (Today / Progress / Setup) */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --sunk:#F4F6F9; --ink:#141C25; --muted:#5A6774; --line:#D3D9E1;
  --accent:#2347C9; --accent-ink:#FFFFFF; --accent-soft:#E2E8FB;
  --good:#1D7F4C; --good-soft:#DDF1E6; --warn:#A8670E; --warn-soft:#F8EBD6; --bad:#B4322C; --bad-soft:#F7E0DE;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141A; --surface:#171F28; --sunk:#121920; --ink:#E5EAF0; --muted:#92A0AE; --line:#29333F;
  --accent:#7D95FF; --accent-ink:#0D1220; --accent-soft:#1E2848;
  --good:#4CC489; --good-soft:#15301F; --warn:#E3AA4E; --warn-soft:#352813; --bad:#F07B72; --bad-soft:#3A1A18;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#171F28; --sunk:#121920; --ink:#E5EAF0; --muted:#92A0AE; --line:#29333F;
  --accent:#7D95FF; --accent-ink:#0D1220; --accent-soft:#1E2848;
  --good:#4CC489; --good-soft:#15301F; --warn:#E3AA4E; --warn-soft:#352813; --bad:#F07B72; --bad-soft:#3A1A18;
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--accent)}
.tabs{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

h2{font-family:var(--display);font-weight:600;font-size:22px;text-transform:uppercase;letter-spacing:.04em;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0;letter-spacing:.02em}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px 16px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{width:100%;min-height:64px;padding:12px 18px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:20px;letter-spacing:.01em;box-shadow:0 8px 22px -8px var(--accent)}
.btn.big small{font-size:13px;font-weight:500;opacity:.9;letter-spacing:0}
.btn.big:active{transform:translateY(1px)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.notice{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:16px}

/* Date nav */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px}
.datenav .d{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.05;text-transform:uppercase}
.datenav .sub{font-size:13px;color:var(--muted)}
.jump{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;background:var(--surface);color:var(--ink,inherit);font-weight:600;cursor:pointer}
.jump input{border:0;background:transparent;color:inherit;font:inherit;font-size:13px;padding:2px 0;max-width:9.5em}
.jump span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.notice.preview{margin-top:12px}
.pill:disabled{cursor:default;opacity:.75}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font-size:18px;line-height:1}

/* Supplements */
.meter{display:flex;align-items:center;gap:10px}
.meter-track{flex:1;height:8px;background:var(--sunk);border:1px solid var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.meter-fill{height:100%;background:var(--good);transition:width .25s}
.group{display:flex;flex-direction:column}
.group + .group{border-top:1px solid var(--line)}
.group-h{padding:10px 16px 2px}
.pill{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:10px 16px;border:0;background:none;text-align:left;width:100%}
.pill:hover{background:var(--sunk)}

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=> (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,'').slice(0,16);
const pad2 = n=>String(n).padStart(2,'0');
const keyOf = d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const parseKey = k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const todayKey = ()=>keyOf(new Date());
const addDays = (k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d);};
const fmtLong = k=>parseKey(k).toLocaleDateString(undefined,{weekday:'long'});
const fmtShort = k=>parseKey(k).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const num = v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0;};
const fmtW = w=>{const r=Math.round(w*100)/100;return (r%1===0?r.toFixed(0):String(r));};
const e1rm = (w,r)=> r<=1? w : w*(1+r/30);
const SLOTS=[
  {id:'Wake',label:'On waking',time:'05:30'},
  {id:'Breakfast',label:'Breakfast',time:'07:15'},
  {id:'Mid-morning',label:'Mid-morning',time:'10:00'},
  {id:'Lunch',label:'Lunch',time:'12:00'},
  {id:'Pre-workout',label:'Pre-workout',time:'14:45'},
  {id:'Dinner',label:'Dinner',time:'18:00'},
  {id:'Night',label:'Evening',time:'20:45'},
  {id:'Bedtime',label:'Bedtime',time:'21:30'}];
const LEGACY={Morning:'Breakfast',Midday:'Lunch',Evening:'Dinner'};
const slotOf=s=>{const t=LEGACY[s.timing]||s.timing;return SLOTS.some(x=>x.id===t)?t:'Breakfast';};
const fmtClock=v=>{const m=/^(\d{1,2}):(\d{2})$/.exec(v||'');if(!m)return v||'';let h=+m[1];const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+m[2]+' '+ap;};
const slotTime=id=>((S.supps.slotTimes||{})[id])||SLOTS.find(x=>x.id===id).time;
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const KIND={rx:'Rx',inj:'Injection',supp:'Supplement',cardio:'Cardio'};
const CHECK='<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

/* ---------- phone app bridge + local storage (used only inside the Android app) ---------- */
const BRIDGE=window.AndroidBridge||null;
function localDB(){
  const KEY='sl.db'; let data={};
  try{data=JSON.parse(localStorage.getItem(KEY))||null;}catch(e){data=null;}
  if(!data){data=(window.SL_SEED&&window.SL_SEED.docs)?JSON.parse(JSON.stringify(window.SL_SEED.docs)):{};try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
  try{const sv=+(localStorage.getItem('sl.seedv')||0), seedP=window.SL_SEED&&window.SL_SEED.docs&&window.SL_SEED.docs['tracker/program'];
    if(seedP&&(seedP.seedVersion||1)>sv){const old=data['tracker/program'];const np=JSON.parse(JSON.stringify(seedP));
      if(old&&old.startDate)np.startDate=old.startDate; if(old&&old.name)np.name=old.name; data['tracker/program']=np;
      localStorage.setItem(KEY,JSON.stringify(data)); localStorage.setItem('sl.seedv',String(seedP.seedVersion||1));}}catch(e){}
  try{const ss=window.SL_SEED&&window.SL_SEED.docs&&window.SL_SEED.docs['tracker/supplements'], sv2=+(localStorage.getItem('sl.suppv')||0);
    if(ss&&(ss.seedVersion||1)>sv2){const cur=data['tracker/supplements'];
      if(cur&&Array.isArray(cur.items)){const have=new Set(cur.items.map(x=>x.id));for(const it of ss.items||[])if(it.addInSeed&&!have.has(it.id))cur.items.push(JSON.parse(JSON.stringify(it)));
        cur.slotTimes=Object.assign({},ss.slotTimes||{},cur.slotTimes||{});}
      localStorage.setItem(KEY,JSON.stringify(data)); localStorage.setItem('sl.suppv',String(ss.seedVersion||1));}}catch(e){}
  const subs=new Set();
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){} subs.forEach(f=>{try{f();}catch(e){}});};
  const meta={fromCache:false,hasPendingWrites:false};
  const snap=path=>{const v=data[path];return {id:path.split('/').pop(),exists:v!==undefined,data:()=>v,metadata:meta};};
  const docRef=path=>({path,id:path.split('/').pop(),
    get:async()=>snap(path),
    set:async d=>{data[path]=JSON.parse(JSON.stringify(d));persist();},
    update:async d=>{if(data[path]===undefined)throw {code:'invalid_argument',message:'missing'};data[path]=Object.assign({},data[path],JSON.parse(JSON.stringify(d)));persist();},
    delete:async()=>{delete data[path];persist();},
    onSnapshot(next){const f=()=>next(snap(path));subs.add(f);setTimeout(f,0);return()=>subs.delete(f);}});
  const query=(col,ord,lim)=>{
    const run=()=>{const depth=col.split('/').length+1;let docs=Object.keys(data).filter(p=>p.startsWith(col+'/')&&p.split('/').length===depth).map(snap);
      if(ord){const [f,dir]=ord;docs.sort((a,b)=>{const x=(a.data()||{})[f],y=(b.data()||{})[f];return (x<y?-1:x>y?1:0)*(dir==='desc'?-1:1);});}
      if(lim)docs=docs.slice(0,lim);return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:meta};};
    return {path:col,orderBy:(f,dir)=>query(col,[f,dir||'asc'],lim),limit:n=>query(col,ord,n),where:()=>query(col,ord,lim),
      get:async()=>run(),doc:id=>docRef(col+'/'+(id||uid())),add:async d=>{const r=docRef(col+'/'+uid());await r.set(d);return r;},
      onSnapshot(next){const f=()=>next(run());subs.add(f);setTimeout(f,0);return()=>subs.delete(f);}};};
  return {doc:docRef,collection:c=>query(c,null,0)};
}

/* ---------- state ---------- */
const S={
  db:null, dbState:'loading', readOnly:false, err:'',
  loaded:{supps:false,program:false,logs:false,workouts:false},
  supps:{items:[],example:false},
  program:{name:'',unit:'lb',days:[],example:false},
  logs:{}, workouts:[],
  tab:(lsGet('sl.tab')||'today'), date:todayKey(),
  session:lsGet('sl.session'), pickDay:null, progressEx:null,
  confirm:null, savedAt:0, saving:false
};
if(!['today','progress','setup'].includes(S.tab)) S.tab='today';

/* ---------- persistence ---------- */
const queues={};
function handleErr(e){
  const code=e&&e.code;
  if(code==='invalid_argument'){S.readOnly=true;S.err='This view can’t save changes. Open the tracker from your own account to log entries.';}
  else if(code==='quota_exceeded'){S.err='Storage is full. Delete some old workouts to keep logging.';}
  else S.err='Couldn’t save just now. Check your connection; your last change may not be stored.';
  render();
}
function write(path,data){
  if(!S.db||S.readOnly) return Promise.resolve();
  const prev=queues[path]||Promise.resolve();
  const p=prev.catch(()=>{}).then(()=>S.db.doc(path).set(data)).then(()=>{S.savedAt=Date.now();S.err='';tickSaved();}).catch(handleErr);
  queues[path]=p; return p;
}
function remove(path){
  if(!S.db||S.readOnly) return Promise.resolve();
  const prev=queues[path]||Promise.resolve();
  const p=prev.catch(()=>{}).then(()=>S.db.doc(path).delete()).catch(handleErr);
  queues[path]=p; return p;
}
const timers={};
function debounced(key,fn,ms=700){clearTimeout(timers[key]);S.saving=true;tickSaved();timers[key]=setTimeout(()=>{S.saving=false;fn();},ms);}
function saveSupps(){S.supps.example=false;debounced('supps',()=>write('tracker/supplements',clone(S.supps)));}
function saveProgram(now){S.program.example=false;const f=()=>write('tracker/program',clone(S.program));now?f():debounced('program',f);}
const clone=o=>JSON.parse(JSON.stringify(o));
function syncReminders(){
  if(!BRIDGE||!BRIDGE.setSchedule) return;
  try{BRIDGE.setSchedule(JSON.stringify({
    slots:SLOTS.map(x=>({id:x.id,label:x.label,time:slotTime(x.id)})),

function exportJSON(){
  const docs={'tracker/supplements':S.supps,'tracker/program':S.program};
  for(const k in S.logs) docs['supplog/'+k]=S.logs[k];
  for(const w of S.workouts) docs['workouts/'+w.id]=w;
  return JSON.stringify({app:'stack-and-lift',v:1,exported:new Date().toISOString(),docs});
}
async function importJSON(txt){
  let o=null; try{o=JSON.parse(txt);}catch(e){}
  if(!o||o.app!=='stack-and-lift'||!o.docs){S.ioMsg='That text isn’t a Stack & Lift backup. Copy everything from Export and paste it again.';render();return;}
  if(!S.db){S.ioMsg='Saving is off in this view, so nothing was imported.';render();return;}
  const ok=/^(tracker\/(supplements|program)|supplog\/[\w.-]+|workouts\/[\w.-]+)$/;
  const keep=new Set(Object.keys(o.docs).filter(p=>ok.test(p)));
  S.ioMsg='Importing…';render();
  for(const k in S.logs){const p='supplog/'+k;if(!keep.has(p))await remove(p);}
  for(const w of S.workouts){const p='workouts/'+w.id;if(!keep.has(p))await remove(p);}
  let n=0; for(const p of keep){await write(p,o.docs[p]);n++;}
  S.ioIn='';S.io=null;S.ioMsg='Imported '+n+' records.';render();
}

  if(S.io==='export') h+='<textarea class="inp ta" id="io-out" readonly aria-label="Exported backup">'+esc(S.ioText)+'</textarea><div class="row"><button class="btn sm primary" data-act="copy-export">Copy</button><span class="saved" id="copymsg"></span></div>';

const activeSupps=()=>S.supps.items.filter(s=>s.active!==false);
const onDay=(s,k)=>!Array.isArray(s.days)||!s.days.length||s.days.includes(parseKey(k).getDay());
const dueOn=k=>activeSupps().filter(s=>onDay(s,k));
const dayLog=k=>S.logs[k]||{date:k,taken:{}};
function dayFraction(k){const all=activeSupps();if(!all.length)return 0;const a=dueOn(k);if(!a.length)return 1;const t=dayLog(k).taken||{};return a.filter(s=>t[s.id]).length/a.length;}
function vialChip(s){
  if(!s.discardOn)return '';
  const d=Math.round((parseKey(s.discardOn)-parseKey(todayKey()))/86400000);
  if(d<0)return '<span class="chip deload">Vial expired '+esc(fmtShort(s.discardOn))+'</span>';
  if(d<=7)return '<span class="chip hold">Discard vial in '+d+(d===1?' day':' days')+'</span>';
  return '<span class="chip top">Vial good to '+esc(fmtShort(s.discardOn))+'</span>';
}
function kindChip(s){return s.kind==='rx'?'<span class="chip build">Rx</span>':s.kind==='inj'?'<span class="chip build">Injection</span>':s.kind==='cardio'?'<span class="chip up">Cardio</span>':'';}

function figSvg(f,pose,label){
  const L=(pts,cls)=>'<polyline class="'+(cls||'fl')+'" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>';
  let g='<line class="fground" x1="2" y1="104.5" x2="118" y2="104.5"/>';
  for(const pr of f.props||[]){const [t,a,b,c,d]=pr;
    if(t==='bench') g+='<rect class="fprop" x="'+a+'" y="'+b+'" width="'+(c-a)+'" height="5" rx="2"/><line class="fpropl" x1="'+(a+6)+'" y1="'+(b+5)+'" x2="'+(a+6)+'" y2="104"/><line class="fpropl" x1="'+(c-6)+'" y1="'+(b+5)+'" x2="'+(c-6)+'" y2="104"/>';
    else if(t==='incl') g+='<line class="fpropw" x1="'+a+'" y1="'+b+'" x2="'+c+'" y2="'+d+'"/><line class="fpropl" x1="'+a+'" y1="'+b+'" x2="'+a+'" y2="104"/>';
    else if(t==='seat') g+='<rect class="fprop" x="'+a+'" y="'+b+'" width="'+(c-a)+'" height="5" rx="2"/><line class="fpropl" x1="'+((a+c)/2)+'" y1="'+(b+5)+'" x2="'+((a+c)/2)+'" y2="104"/>';
    else if(t==='backrest') g+='<line class="fpropw" x1="'+a+'" y1="'+b+'" x2="'+c+'" y2="'+d+'"/>';
    else if(t==='hbar') g+='<line class="fpropw" x1="'+a+'" y1="'+b+'" x2="'+c+'" y2="'+b+'"/><line class="fpropl" x1="'+a+'" y1="'+b+'" x2="'+a+'" y2="104"/><line class="fpropl" x1="'+c+'" y1="'+b+'" x2="'+c+'" y2="104"/>';
    else if(t==='post') g+='<line class="fpropl" x1="'+(a+12)+'" y1="'+b+'" x2="'+(a+12)+'" y2="'+c+'"/>';
    else if(t==='dipbar') g+='<line class="fpropw" x1="'+(a-4)+'" y1="'+b+'" x2="'+(a+14)+'" y2="'+b+'"/>';
    else if(t==='box') g+='<rect class="fprop" x="'+a+'" y="'+b+'" width="'+c+'" height="'+d+'" rx="2"/>';
    else if(t==='step') g+='<rect class="fprop" x="'+a+'" y="'+b+'" width="'+(c-a)+'" height="4" rx="1"/>';
    else if(t==='pad') g+='<rect class="fprop" x="'+a+'" y="'+b+'" width="'+(c-a)+'" height="'+(d-b)+'" rx="4"/><line class="fpropl" x1="'+((a+c)/2)+'" y1="'+d+'" x2="'+((a+c)/2)+'" y2="104"/>';
    else if(t==='footplate') g+='<line class="fpropw" x1="'+a+'" y1="'+b+'" x2="'+c+'" y2="'+d+'"/>';
    else if(t==='bike') g+='<circle class="fpropl" cx="34" cy="92" r="12" fill="none"/><circle class="fpropl" cx="92" cy="92" r="12" fill="none"/><polyline class="fpropl" fill="none" points="34,92 50,60 64,92 34,92"/><polyline class="fpropl" fill="none" points="64,92 84,52 92,92"/><line class="fpropw" x1="44" y1="58" x2="56" y2="58"/>';
  }
  const loadAt=(pt,kind)=>kind==='bar'?'<circle class="fload" cx="'+pt[0]+'" cy="'+pt[1]+'" r="7"/><circle class="fhub" cx="'+pt[0]+'" cy="'+pt[1]+'" r="1.6"/>'
    :kind==='db'?'<rect class="fload" x="'+(pt[0]-5)+'" y="'+(pt[1]-2.5)+'" width="10" height="5" rx="1.5"/>'
    :kind==='wheel'?'<circle class="fload" cx="'+pt[0]+'" cy="'+pt[1]+'" r="6"/>':'';
  const j=pose;
  if(f.front){
    g+=L([j.s,j.p]);
    for(const a of j.arms) g+=L(a);
    for(const l of j.legs) g+=L(l);
    g+=L([j.arms[0][0],j.arms[1][0]]);
    if(j.lmf) g+='<line class="fload-l" x1="50" y1="104" x2="'+j.lmf[0]+'" y2="'+j.lmf[1]+'"/>';
    for(const d of j.dbs||[]) g+=loadAt(d,'db');
  }else{
    if(j.k2) g+=L([j.p,j.k2,j.a2],'fl2');
    if(j.e2) g+=L([j.s,j.e2,j.w2],'fl2');
    if(j.lm) g+='<line class="fload-l" x1="6" y1="104" x2="'+j.lm[0]+'" y2="'+j.lm[1]+'"/><circle class="fload" cx="'+j.lm[0]+'" cy="'+j.lm[1]+'" r="3"/>';
    if(j.ball) g+='<circle class="fball" cx="'+j.ball[0]+'" cy="'+j.ball[1]+'" r="'+j.ball[2]+'"/>';
    g+=L([j.s,j.p]); g+=L([j.p,j.k,j.a].concat(j.t?[j.t]:[]));
    if(j.e) g+=L([j.s,j.e,j.w]);
    if(j.pad) g+='<rect class="fprop" x="'+(j.pad[0]-4)+'" y="'+(j.pad[1]-4)+'" width="8" height="8" rx="3"/>';
    if(j.bar) g+=loadAt(j.bar,'bar'); if(j.db) g+=loadAt(j.db,'db'); if(j.wheel) g+=loadAt(j.wheel,'wheel');
  }
  g+='<circle class="fhead" cx="'+j.h[0]+'" cy="'+j.h[1]+'" r="6"/>';
  return '<figure class="fig1"><svg viewBox="0 -2 120 112" role="img" aria-label="'+esc(label)+'">'+g+'</svg><figcaption>'+esc(label)+'</figcaption></figure>';
}

function exGroupsOf(name){const n=String(name).toLowerCase();const g=Object.keys(EX_GROUPS).filter(k=>EX_GROUPS[k].some(x=>x.toLowerCase()===n));if(g.length)return g;for(const p of EX_RX)if(p[0].test(name))return [p[1]];return [];}

function doSwap(rowId,name,perm){
  const s=S.session; if(!s)return; const raw=baseItems(s)||[]; const it=raw.find(x=>x.id===rowId); if(!it)return;
  const orig=it.name;
  if(name.toLowerCase()===orig.toLowerCase()){ if(s.swaps)delete s.swaps[rowId]; }
  else if(perm){
    if(s.mode==='per'){for(const w of perWeeks())if(w.week>=s.week)for(const d of w.days)if(d.dow===s.dow)for(const p of d.items)if(p.name===orig){p.name=name;p.key=slugify(name);p.notes='';if(!p.cardioMin){p.weight=0;p.assist=0;p.barbell=false;if(p.load==='Bodyweight')p.load='';}}}
    else{const ex=findEx(rowId);if(ex){ex.name=name;ex.weight=0;ex.barbell=false;ex.misses=0;}}
    if(s.swaps)delete s.swaps[rowId];

  } else {(s.swaps=s.swaps||{})[rowId]={name,key:slugify(name)};}
  const cur=(sessionItems(s)||[]).find(x=>x.id===rowId); const rows=s.entries[rowId]||[];
  if(cur&&!rows.some(r=>r.done||String(r.r).trim()))s.entries[rowId]=Array.from({length:Math.max(1,cur.sets)},()=>({w:cur.wPre,r:'',done:false}));
  S.swapFor=null; persistSession(); render();
}

function baseItems(s){
  const unit=S.program.unit;
  if(!s) return null;
  if(s.mode==='free') return [];
  if(s.mode==='per'){const d=perDay(s.week,s.dow);if(!d)return null;
    return d.items.map(it=>({id:it.id,key:it.key,name:it.name,sets:it.cardioMin?1:it.sets,repPh:it.cardioMin?'min':String(it.reps),repFill:it.cardioMin||repTop(it.reps),repMinN:repLow(it.reps),
      wPre:it.cardioMin?'':(it.weight>0?it.weight:(it.assist||(it.load==='Bodyweight'?0:''))),wLabel:it.assist?'Assist':unit,
      target:perTarget(it,unit),notes:it.notes||'',cardio:!!it.cardioMin,cardioMin:it.cardioMin||0,assist:it.assist||0,weight:it.weight||0,barbell:!!it.barbell,ex:null}));}
  const day=S.program.days.find(d=>d.id===s.dayId); if(!day) return null;
  return day.exercises.map(ex=>({id:ex.id,key:ex.id,name:ex.name,sets:ex.sets,repPh:ex.repMin===ex.repMax?String(ex.repMin):ex.repMin+'–'+ex.repMax,repFill:ex.repMax,repMinN:ex.repMin,
    wPre:num(ex.weight)||'',wLabel:unit,target:targetTxt(ex,unit),notes:'',cardio:false,assist:0,weight:num(ex.weight),barbell:!!ex.barbell,ex}));
}
function sessionTitle(s){if(s.mode==='free')return 'Extra session';if(s.mode==='per'){const d=perDay(s.week,s.dow);return 'Week '+s.week+' · '+(d?d.name:'');}const day=S.program.days.find(d=>d.id===s.dayId);return day?day.name:'';}
function findEx(id){for(const d of S.program.days)for(const e of d.exercises)if(e.id===id)return e;return null;}
function nextDay(){const days=S.program.days;if(!days.length)return null;const last=S.workouts.find(w=>days.some(d=>d.id===w.dayId));if(!last)return days[0];const i=days.findIndex(d=>d.id===last.dayId);return days[(i+1)%days.length];}
function lastFor(exId,before){for(const w of S.workouts){if(before&&w.id===before)continue;const e=(w.entries||[]).find(x=>x.exId===exId);if(e&&e.sets&&e.sets.length)return {w,e};}return null;}
function targetTxt(ex,unit){const reps=ex.repMin===ex.repMax?ex.repMin:ex.repMin+'–'+ex.repMax;return ex.sets+' × '+reps+(num(ex.weight)>0?' @ '+fmtW(ex.weight)+' '+unit:' · bodyweight');}
function plateMath(total,unit){
  const bar=unit==='kg'?20:45, set=unit==='kg'?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5];
  let side=(total-bar)/2; if(side<0) return null; if(side===0) return {txt:'Empty bar',plates:[]};
  const out=[]; for(const p of set){while(side>=p-1e-9){out.push(p);side-=p;}}
  const rem=Math.round(side*100)/100;
  return {txt:out.map(fmtW).join(' + ')+' per side'+(rem?' (+'+fmtW(rem)+' short)':''),plates:out,max:set[0]};
}
function platesHtml(ex,unit){
  if(!ex.barbell||!num(ex.weight))return '';
  const pm=plateMath(num(ex.weight),unit); if(!pm)return '';
  const bars=pm.plates.map(p=>'<i class="plate" style="height:'+Math.round(8+16*p/pm.max)+'px"></i>').join('');
  return '<div class="plates" title="Bar is '+(unit==='kg'?'20 kg':'45 lb')+'">'+bars+'<span>'+esc(pm.txt)+'</span></div>';
}
const RESULT={logged:['top','Logged'],done:['up','Hit target'],miss:['hold','Missed reps'],cardio:['top','Cardio'],up:['up','↑ Add weight next time'],build:['build','Building reps'],hold:['hold','Missed reps · repeat'],deload:['deload','Deload 10%'],top:['top','Top of range']};
function evaluate(ex,sets){
  const n=ex.sets, w=num(ex.weight), inc=num(ex.increment);
  const logged=sets.filter(s=>s.r>0).slice(0,Math.max(n,1));
  const allTop=logged.length>=n&&logged.every(s=>s.w>=w-1e-9&&s.r>=ex.repMax);
  const anyMiss=logged.length<n||logged.some(s=>s.r<ex.repMin);
  let result,next=w,misses=ex.misses||0;
  if(allTop){ if(inc>0){result='up';next=w+inc;}else result='top'; misses=0;}
  else if(anyMiss){ misses++; if(misses>=3&&w>0){result='deload';next=inc>0?Math.max(0,Math.round(w*0.9/inc)*inc):Math.round(w*0.9*2)/2;misses=0;} else result='hold'; }
  else {result='build';misses=0;}
  return {result,next,misses};
}

/* ---------- session ---------- */
function sessionHasReps(s){return !!s&&Object.values(s.entries||{}).some(rows=>(rows||[]).some(r=>String(r.r==null?'':r.r).trim()!==''));}
async function startSession(spec){
  if(S.session){ if(sessionHasReps(S.session)) await finishSession(); if(S.session){S.session=null;persistSession();} }
  const ss={id:uid(),date:S.date,startedAt:Date.now(),entries:{}};
  if(spec.free){ss.mode='free';}else if(spec.week){ss.mode='per';ss.week=spec.week;ss.dow=spec.dow;}else ss.dayId=spec.dayId;
  const items=sessionItems(ss); if(!items) return;
  const _pl=ss.mode==='per'?(S.plans[planKey(S.date,ss.week,ss.dow)]||null):null;
  if(_pl&&_pl.swaps&&Object.keys(_pl.swaps).length){ss.swaps=JSON.parse(JSON.stringify(_pl.swaps));items.splice(0,items.length,...sessionItems(ss));}
  const _pw=id=>(_pl&&_pl.w&&_pl.w[id]!=null&&_pl.w[id]!=='')?_pl.w[id]:null;
  for(const it of items) ss.entries[it.id]=Array.from({length:Math.max(1,it.sets)},()=>({w:_pw(it.id)!=null?_pw(it.id):it.wPre,r:'',done:false}));
  S.openEx=null; S.techFor=null;
  S.swapFor=null; S.session=ss; persistSession(); wake(true); render();
}
function persistSession(){lsSet('sl.session',S.session);}
async function finishSession(){
  const s=S.session; if(!s) return;
  const items=sessionItems(s); if(!items){S.session=null;persistSession();render();return;}
  const unit=S.program.unit, entries=[];
  for(const it of items){
    const sets=(s.entries[it.id]||[]).map(x=>({w:num(x.w),r:Math.round(num(x.r))})).filter(x=>x.r>0);
    if(!sets.length) continue;
    if(it.cardio){entries.push(Object.assign({exId:it.key,name:it.name,cardio:true,sets:[{w:0,r:sets[0].r}],result:'cardio',target:{minutes:it.cardioMin}},it.swappedFrom?{swappedFrom:it.swappedFrom}:{}));continue;}
    if(it.extra){entries.push({exId:it.key,name:it.name,sets,result:'logged',extra:true});continue;}
    if(it.ex){const ex=it.ex,ev=evaluate(ex,sets);
      entries.push({exId:ex.id,name:ex.name,target:{sets:ex.sets,repMin:ex.repMin,repMax:ex.repMax,weight:num(ex.weight)},sets,result:ev.result,nextWeight:ev.next});
      ex.weight=ev.next; ex.misses=ev.misses; continue;}
    const ok=sets.length>=it.sets&&sets.every(x=>x.r>=it.repMinN);
    const e={exId:it.key,rowId:it.id,name:it.name,target:{sets:it.sets,reps:it.repPh,weight:it.weight},sets,result:ok?'done':'miss'};
    if(it.assist){e.assist=true;e.target.assist=it.assist;}
    if(it.swappedFrom)e.swappedFrom=it.swappedFrom;
    entries.push(e);
  }
  if(!entries.length){S.err='Enter reps for at least one set before saving.';render();return;}
  const doc={id:s.id,date:s.date,dayId:s.mode==='per'?('w'+s.week+'-'+s.dow):s.mode==='free'?'free':s.dayId,dayName:sessionTitle(s),unit,entries,
    minutes:Math.max(1,Math.round((Date.now()-s.startedAt)/60000)),createdAt:Date.now()};
  if(s.mode==='per') doc.week=s.week;
  S.workouts=[doc,...S.workouts.filter(w=>w.id!==doc.id)].sort(sortW);
  S.session=null; persistSession(); wake(false); stopRest(); S.err='';
  render();
  await write('workouts/'+doc.id,doc);
  if(s.mode!=='per'&&s.mode!=='free') saveProgram(true);
}

function nice(lo,hi,n){const span=hi-lo||1;const step0=span/n;const mag=Math.pow(10,Math.floor(Math.log10(step0)));const err=step0/mag;const step=(err>=7.5?10:err>=3.5?5:err>=1.5?2:1)*mag;return {lo:Math.floor(lo/step)*step,hi:Math.ceil(hi/step)*step,step};}
function chart(pts,unit){
  if(pts.length<2) return '<div class="empty" style="padding:28px 8px"><span>Log this lift '+(pts.length?'once more':'twice')+' to see a trend line.</span>'+(pts.length?'<b class="num">'+fmtW(pts[0].top)+' '+esc(unit)+' top set</b>':'')+'</div>';
  const W=640,H=240,L=46,R=14,T=14,B=30;
  const t0=parseKey(pts[0].date).getTime(), t1=parseKey(pts[pts.length-1].date).getTime()||t0+1;
  const ys=pts.flatMap(p=>[p.top,p.e1]); const sc=nice(Math.min(...ys)*0.95,Math.max(...ys)*1.02,4);
  const x=t=>L+(W-L-R)*((t-t0)/((t1-t0)||1)), y=v=>T+(H-T-B)*(1-(v-sc.lo)/((sc.hi-sc.lo)||1));
  let g='';
  for(let v=sc.lo;v<=sc.hi+1e-9;v+=sc.step){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+fmtW(v)+'</text>';}
  const ticks=Math.min(5,pts.length); for(let i=0;i<ticks;i++){const p=pts[Math.round(i*(pts.length-1)/Math.max(1,ticks-1))];const tx=x(parseKey(p.date).getTime());g+='<text x="'+tx+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':i===ticks-1?'end':'middle')+'">'+esc(fmtShort(p.date))+'</text>';}
  const line=(key)=>pts.map((p,i)=>(i?'L':'M')+x(parseKey(p.date).getTime()).toFixed(1)+' '+y(p[key]).toFixed(1)).join(' ');
  const area=line('top')+' L'+x(t1).toFixed(1)+' '+(H-B)+' L'+x(t0).toFixed(1)+' '+(H-B)+' Z';
  const lp=pts[pts.length-1], lx=x(t1), ly=y(lp.top);
  g+='<path d="'+area+'" fill="var(--accent)" fill-opacity=".10"/>';
  g+='<path d="'+line('e1')+'" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>';
  g+='<path d="'+line('top')+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  g+=pts.map(p=>'<circle cx="'+x(parseKey(p.date).getTime())+'" cy="'+y(p.top)+'" r="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>').join('');
  g+='<circle cx="'+lx+'" cy="'+ly+'" r="5.5" fill="var(--accent)"/>';
  g+='<text x="'+(lx-8)+'" y="'+(ly-10)+'" text-anchor="end" style="fill:var(--ink);font-weight:500">'+fmtW(lp.top)+' '+esc(unit)+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Top set weight over time">'+g+'</svg>';
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-goto],[data-act]'); if(!t) return;
  if(t.matches('select')) return;
  if(t.dataset.tab||t.dataset.goto){S.tab=t.dataset.tab||t.dataset.goto;S.confirm=null;lsSet('sl.tab',S.tab);render();window.scrollTo({top:0});return;}
  const a=t.dataset.act, id=t.dataset.id;
  switch(a){
    case 'dismiss-err': S.err='';render();break;
    case 'export': S.io='export';S.ioText=exportJSON();S.ioMsg='';render();break;
    case 'share-export': try{BRIDGE.share(exportJSON());}catch(e){}break;
    case 'show-import': S.io='import';S.ioMsg='';render();break;
    case 'copy-export': {const ta=$('#io-out'),m=$('#copymsg');const ok=()=>{if(m)m.textContent='Copied';};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(S.ioText).then(ok,()=>{if(ta){ta.focus();ta.select();}if(m)m.textContent='Select all and copy';});}
      else if(ta){ta.focus();ta.select();if(m)m.textContent='Select all and copy';}break;}
    case 'do-import': if((S.ioIn||'').trim()){S.confirm='import';render();}break;
    case 'import-yes': S.confirm=null;importJSON(S.ioIn||'');break;
    case 'notif-test': try{BRIDGE.testNotification();}catch(e){}break;
    case 'notif-settings': try{BRIDGE.openNotificationSettings();}catch(e){}break;
    case 'day': {const n=+t.dataset.n;S.date=addDays(S.date,n);S.pickDay=null;S.confirm=null;render();break;}
    case 'today': S.date=todayKey();S.pickDay=null;render();break;
    case 'take': toggleTake(id);break;
    case 'start': startSession({dayId:id}).then(scrollTrain);break;
    case 'start-per': startSession({week:+t.dataset.wk,dow:+t.dataset.dow}).then(scrollTrain);break;
    case 'open-stale': if(S.session){S.date=S.session.date;S.pickDay=null;render();scrollTrain();}break;
    case 'goto-train': scrollTrain();break;
    case 'start-free': startSession({free:true});break;
    case 'add-extra': {const ni=$('#add-ex-name'),si=$('#add-ex-sets');const name=(ni&&ni.value||'').trim();if(!name){if(ni)ni.focus();break;}
      const sets=Math.min(10,Math.max(1,Math.round(num(si&&si.value)||3)));const x={id:'x'+uid(),key:slugify(name),name,sets};
      S.session.extras=(S.session.extras||[]).concat(x);S.session.entries[x.id]=Array.from({length:sets},()=>({w:'',r:'',done:false}));
      persistSession();render();const el=$('#w-'+x.id+'-0');if(el)el.focus();break;}
    case 'ex-open': {const key=t.dataset.key||((parseOpen()||{}).key);const v=key+'#'+id;S.openEx=(S.openEx===v||!t.dataset.key)?null:v;render();if(S.openEx){const el=document.querySelector('[data-act="ex-open"][data-id="'+id+'"]');if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest'});}break;}
    case 'plan-swap': doSwapPlan(id,t.dataset.name||'',!!($('#swap-all')&&$('#swap-all').checked));break;
    case 'plan-swap-custom': {const el=$('#swap-name');const nm=(el&&el.value||'').trim();if(!nm){if(el)el.focus();break;}doSwapPlan(id,nm,!!($('#swap-all')&&$('#swap-all').checked));break;}
    case 'plan-swap-undo': {const o=parseOpen();if(o){const pl=getPlan(o.key,true);delete pl.swaps[id];delete pl.w[id];savePlans();render();}break;}
    case 'pw-step': {const o=parseOpen();if(!o)break;const pl=getPlan(o.key,false);const ctx={mode:'per',week:o.n,dow:o.dow,swaps:pl.swaps};const pi=(sessionItems(ctx)||[]).find(x=>x.id===id)||{};const cur=(pl.w[id]!=null&&pl.w[id]!=='')?num(pl.w[id]):(pi.swappedFrom?0:num(pi.weight)||num(pi.assist)||0);setPlanW(id,Math.max(0,cur+num(t.dataset.d)));break;}
    case 'pw-target': {const o=parseOpen();if(!o)break;const pl=getPlan(o.key,false);const pi=(sessionItems({mode:'per',week:o.n,dow:o.dow,swaps:pl.swaps})||[]).find(x=>x.id===id);if(pi)setPlanW(id,num(pi.weight));break;}
    case 'pw-clear': setPlanW(id,null);break;
    case 'water-add': addWater(S.date,num(t.dataset.ml));break;
    case 'water-custom': {const el=$('#water-custom');const v=num(el&&el.value);if(!(v>0)){if(el)el.focus();break;}addWater(S.date,waterCfg().unit==='ml'?v:v*OZ);break;}
    case 'water-undo': undoWater(S.date);break;
    case 'act-open': S.actOpen=true;render();{const el=$('#act-name');if(el)el.focus();}break;
    case 'act-cancel': S.actOpen=false;render();break;
    case 'act-save': saveActivity();break;
    case 'act-del': S.confirm='actdel:'+id;render();break;
    case 'act-del-yes': S.workouts=S.workouts.filter(w=>w.id!==id);S.confirm=null;render();remove('workouts/'+id);break;
    case 'tech-open': S.techFor=(S.techFor===id?null:id);render();break;
    case 'chirp-toggle': {const on=!chirpOn();lsSet('sl.chirp',on);if(on){ensureAudio();chirp(true);}drawRest();break;}
    case 'swap-open': S.swapFor=(S.swapFor===id?null:id);render();break;
    case 'swap-undo': if(S.session.swaps)delete S.session.swaps[id];S.swapFor=null;persistSession();render();break;
    case 'do-swap': doSwap(id,t.dataset.name||'',!!($('#swap-all')&&$('#swap-all').checked));break;
    case 'swap-custom': {const el=$('#swap-name');const nm=(el&&el.value||'').trim();if(!nm){if(el)el.focus();break;}doSwap(id,nm,!!($('#swap-all')&&$('#swap-all').checked));break;}
    case 'rm-extra': {S.session.extras=(S.session.extras||[]).filter(x=>x.id!==id);delete S.session.entries[id];persistSession();render();break;}
    case 'setdone': {const r=S.session.entries[t.dataset.ex][+t.dataset.i];const it=(sessionItems(S.session)||[]).find(x=>x.id===t.dataset.ex);
      r.done=!r.done; if(r.done&&!String(r.r).trim()&&it&&it.repFill>0){r.r=it.repFill;const ri=$('#r-'+t.dataset.ex+'-'+t.dataset.i);if(ri)ri.value=r.r;}
      t.setAttribute('aria-pressed',String(r.done)); persistSession(); if(r.done&&it&&!it.cardio)startRest(90); break;}
    case 'addset': {const rows=S.session.entries[t.dataset.ex];const lastR=rows[rows.length-1];rows.push({w:lastR?lastR.w:'',r:'',done:false});persistSession();render();break;}
    case 'rmset': {S.session.entries[t.dataset.ex].pop();persistSession();render();break;}
    case 'finish': finishSession();break;
    case 'discard': S.confirm='discard';render();break;
    case 'discard-yes': S.session=null;S.confirm=null;persistSession();wake(false);stopRest();render();break;
    case 'cancel-confirm': S.confirm=null;render();break;
    case 'rest-add': if(rest){rest.end+=30000;if(rest.end>Date.now())rest.chirped=false;drawRest();}break;
    case 'rest-stop': stopRest();break;
    case 'pex': S.progressEx=id;render();break;
    case 'delw': S.confirm='del:'+id;render();break;
    case 'delw-yes': S.workouts=S.workouts.filter(w=>w.id!==id);S.confirm=null;render();remove('workouts/'+id);break;
    case 'sday': {const s=S.supps.items.find(x=>x.id===id);if(s){const d=+t.dataset.d;let days=Array.isArray(s.days)&&s.days.length?s.days.slice():[0,1,2,3,4,5,6];days=days.includes(d)?days.filter(x=>x!==d):days.concat(d).sort();if(!days.length)break;s.days=days.length===7?[]:days;t.setAttribute('aria-pressed',String(days.includes(d)));saveSupps();}break;}
    case 'add-supp': S.supps.items.push({id:uid(),name:'',dose:'',timing:'Breakfast',kind:'supp',days:[],notes:'',caution:'',active:true});saveSupps();render();{const l=S.supps.items[S.supps.items.length-1];const el=$('#sn-'+l.id);if(el)el.focus();}break;
    case 'rm-supp': S.supps.items=S.supps.items.filter(s=>s.id!==id);saveSupps();render();break;
    case 'add-day': S.program.days.push({id:uid(),name:'Day '+(S.program.days.length+1),exercises:[]});saveProgram();render();break;
    case 'rm-day': S.confirm='rmday:'+id;render();break;
    case 'rm-day-yes': S.program.days=S.program.days.filter(d=>d.id!==id);S.confirm=null;saveProgram();render();break;
    case 'add-ex': {const d=S.program.days.find(x=>x.id===id);if(d){const ex={id:uid(),name:'',sets:3,repMin:8,repMax:12,weight:0,increment:5,barbell:false,misses:0};if(S.program.unit==='kg')ex.increment=2.5;d.exercises.push(ex);saveProgram();render();const el=$('#en-'+ex.id);if(el)el.focus();}break;}
    case 'rm-ex': for(const d of S.program.days)d.exercises=d.exercises.filter(x=>x.id!==id);saveProgram();render();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='water-custom'){e.preventDefault();const b=document.querySelector('[data-act="water-custom"]');if(b)b.click();return;}if(e.key==='Enter'&&/^act-(name|min|note)$/.test(e.target.id||'')){e.preventDefault();const b=document.querySelector('[data-act="act-save"]');if(b)b.click();return;}if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('tap')){e.preventDefault();e.target.click();return;}if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.pw){e.preventDefault();e.target.blur();return;}if(e.key==='Enter'&&e.target.id==='swap-name'){e.preventDefault();const b=document.querySelector('[data-act="swap-custom"],[data-act="plan-swap-custom"]');if(b)b.click();return;}if(e.key==='Enter'&&(e.target.id==='add-ex-name'||e.target.id==='add-ex-sets')){e.preventDefault();const b=document.querySelector('[data-act="add-extra"]');if(b)b.click();}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='io-in'){S.ioIn=t.value;return;}
  if(t.dataset.in&&S.session){const r=S.session.entries[t.dataset.ex][+t.dataset.i];r[t.dataset.in]=t.value;persistSession();return;}
  if(t.dataset.slot){S.supps.slotTimes=Object.assign({},S.supps.slotTimes||{},{[t.dataset.slot]:t.value});saveSupps();return;}
  if(t.dataset.sf&&t.type!=='checkbox'&&t.tagName!=='SELECT'){const s=S.supps.items.find(x=>x.id===t.closest('[data-supp]').dataset.supp);if(s){s[t.dataset.sf]=t.value;saveSupps();}return;}
  if(t.dataset.ef&&t.type!=='checkbox'){const ex=findEx(t.closest('[data-ex]').dataset.ex);if(ex){const k=t.dataset.ef;ex[k]=k==='name'?t.value:(k==='weight'||k==='increment'?num(t.value):Math.max(k==='sets'?1:0,Math.round(num(t.value))));if(k==='repMin'&&ex.repMax<ex.repMin)ex.repMax=ex.repMin;saveProgram();}return;}
  if(t.dataset.df){const d=S.program.days.find(x=>x.id===t.closest('[data-day]').dataset.day);if(d){d.name=t.value;saveProgram();}return;}
  if(t.dataset.pf==='name'){S.program.name=t.value;saveProgram();return;}
  if(t.dataset.pf==='startDate'){if(t.value){S.program.startDate=t.value;saveProgram();}return;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.wset){const c=waterCfg(),w=Object.assign({},S.supps.water||{});if(t.dataset.wset==='unit'){w.unit=t.value==='ml'?'ml':'oz';w.goalMl=c.goalMl;}else{const v=num(t.value);if(v>0)w.goalMl=Math.round(c.unit==='ml'?v:v*OZ);w.unit=c.unit;}S.supps.water=w;saveSupps();render();return;}
  if(t.dataset.pw){const v=String(t.value).trim();setPlanW(t.dataset.pw,v===''?null:num(v));return;}
  if(t.id==='pickday'){S.pickDay=t.value;S.openEx=null;render();return;}
  if(t.id==='jumpdate'){if(/^\d{4}-\d{2}-\d{2}$/.test(t.value)){S.date=t.value;S.pickDay=null;render();}return;}
  if(t.id==='setupweek'){S.setupWeek=+t.value;render();return;}
  if(t.dataset.sf==='timing'||t.dataset.sf==='active'||t.dataset.sf==='kind'){const s=S.supps.items.find(x=>x.id===t.closest('[data-supp]').dataset.supp);if(s){s[t.dataset.sf]=t.type==='checkbox'?t.checked:t.value;saveSupps();if(t.dataset.sf!=='active')render();}return;}
  if(t.dataset.ef==='barbell'){const ex=findEx(t.closest('[data-ex]').dataset.ex);if(ex){ex.barbell=t.checked;saveProgram();}return;}
  if(t.dataset.ef&&t.dataset.ef!=='name'){render();return;} // normalize displayed numbers
  if(t.dataset.pf==='unit'){S.program.unit=t.value;saveProgram();render();return;}
});

function toggleTake(id){
  if(S.date>todayKey()) return;
  const k=S.date, log=clone(dayLog(k)); log.date=k; log.taken=log.taken||{};
  if(log.taken[id]) delete log.taken[id];
  else { const now=new Date(); log.taken[id]= k===todayKey()? now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : '✓'; }
  S.logs[k]=log; render(); write('supplog/'+k,log);
}

  const onErr=e=>{ if(e&&e.code!=='revoked'){S.err='Lost connection to your saved data. Reload the page to reconnect.';} Object.keys(S.loaded).forEach(k=>S.loaded[k]=true); render(); };
  db.doc('tracker/supplements').onSnapshot(snap=>{
    if(timers.supps&&S.saving) return;
    const d=snap.exists?snap.data():null; S.supps=d?clone(d):{items:[],example:false}; if(!Array.isArray(S.supps.items))S.supps.items=[];
    S.loaded.supps=true; syncReminders(); softRender();
  },onErr);
  db.doc('tracker/program').onSnapshot(snap=>{
    if(timers.program&&S.saving) return;
    const d=snap.exists?snap.data():null; S.program=d?clone(d):{name:'',unit:'lb',days:[],example:false}; if(!Array.isArray(S.program.days))S.program.days=[];
    S.loaded.program=true; softRender();
  },onErr);
  db.collection('supplog').orderBy('date','desc').limit(400).onSnapshot(q=>{
    const m={}; q.docs.forEach(d=>{const v=d.data();if(v&&v.date)m[v.date]=clone(v);}); S.logs=m; S.loaded.logs=true; softRender();
  },onErr);
  db.collection('workouts').orderBy('date','desc').limit(1000).onSnapshot(q=>{
    S.workouts=q.docs.map(d=>clone(d.data())).filter(w=>w&&w.date).sort(sortW); S.loaded.workouts=true; softRender();
  },onErr);
})();
})();
</script>
</body></html>
