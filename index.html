<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column like a training notebook; sticky bar with three tabs (Today / Progress / Setup) */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --sunk:#F4F6F9; --ink:#141C25; --muted:#5A6774; --line:#D3D9E1;
  --accent:#2347C9; --accent-ink:#FFFFFF; --accent-soft:#E2E8FB;
  --good:#1D7F4C; --good-soft:#DDF1E6; --warn:#A8670E; --warn-soft:#F8EBD6; --bad:#B4322C; --bad-soft:#F7E0DE;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141A; --surface:#171F28; --sunk:#121920; --ink:#E5EAF0; --muted:#92A0AE; --line:#29333F;
  --accent:#7D95FF; --accent-ink:#0D1220; --accent-soft:#1E2848;
  --good:#4CC489; --good-soft:#15301F; --warn:#E3AA4E; --warn-soft:#352813; --bad:#F07B72; --bad-soft:#3A1A18;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#171F28; --sunk:#121920; --ink:#E5EAF0; --muted:#92A0AE; --line:#29333F;
  --accent:#7D95FF; --accent-ink:#0D1220; --accent-soft:#1E2848;
  --good:#4CC489; --good-soft:#15301F; --warn:#E3AA4E; --warn-soft:#352813; --bad:#F07B72; --bad-soft:#3A1A18;
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--accent)}
.tabs{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

h2{font-family:var(--display);font-weight:600;font-size:22px;text-transform:uppercase;letter-spacing:.04em;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0;letter-spacing:.02em}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px 16px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{width:100%;min-height:64px;padding:12px 18px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:20px;letter-spacing:.01em;box-shadow:0 8px 22px -8px var(--accent)}
.btn.big small{font-size:13px;font-weight:500;opacity:.9;letter-spacing:0}
.btn.big:active{transform:translateY(1px)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.notice{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:16px}

/* Date nav */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px}
.datenav .d{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.05;text-transform:uppercase}
.datenav .sub{font-size:13px;color:var(--muted)}
.jump{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;background:var(--surface);color:var(--ink,inherit);font-weight:600;cursor:pointer}
.jump input{border:0;background:transparent;color:inherit;font:inherit;font-size:13px;padding:2px 0;max-width:9.5em}
.jump span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.notice.preview{margin-top:12px}
.pill:disabled{cursor:default;opacity:.75}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font-size:18px;line-height:1}

/* Supplements */
.meter{display:flex;align-items:center;gap:10px}
.meter-track{flex:1;height:8px;background:var(--sunk);border:1px solid var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.meter-fill{height:100%;background:var(--good);transition:width .25s}
.group{display:flex;flex-direction:column}
.group + .group{border-top:1px solid var(--line)}
.group-h{padding:10px 16px 2px}
.pill{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:10px 16px;border:0;background:none;text-align:left;width:100%}
.pill:hover{background:var(--sunk)}

/* Training */
.next{display:flex;flex-direction:column;gap:12px}

.ex-card + .ex-card{border-top:1px solid var(--line)}

.inp{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:7px;padding:8px 10px;font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.inp:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.done{width:40px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.done[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.done svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip.up{background:var(--good-soft);color:var(--good)}
.chip.build{background:var(--accent-soft);color:var(--accent)}

/* Rest timer */

.cal .c{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--sunk);position:relative;font-size:10px;color:var(--muted);padding:3px 4px;overflow:hidden}
.cal .c span{position:relative;z-index:1}
.cal .c i{position:absolute;inset:0;background:var(--good)}
.cal .c.full span{color:var(--surface)}
.cal .h{font-size:10px;text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .b{display:grid;grid-template-columns:minmax(0,1fr) 120px 42px;gap:10px;align-items:center;font-size:14px}
.bars .t{height:8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--good)}
.hist{display:flex;flex-direction:column}
.hist-item{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.hist-item:first-child{border-top:0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-top:0}
td.m{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Setup */
.edit-row{display:grid;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.edit-row:first-child{border-top:0}
.supp-grid{grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr)}
.ex-grid{grid-template-columns:minmax(0,2.2fr) repeat(5,minmax(0,.8fr)) auto auto;align-items:end}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.f .inp{font-family:var(--body);font-size:14px;padding:7px 9px}
.f .inp.n{font-family:var(--mono)}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.tog input{width:16px;height:16px;accent-color:var(--accent)}
.day-head{display:flex;gap:8px;align-items:center;padding:12px 16px;background:var(--sunk);border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;flex-wrap:wrap}
.day-head .inp{max-width:260px;font-family:var(--display);font-size:18px;font-weight:600}
.saved{font-size:12px;color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-weight:600}
.skel{height:14px;border-radius:6px;background:var(--sunk);margin:8px 16px}
.err{color:var(--bad);font-size:13px}

@media (max-width:620px){
  .supp-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .supp-grid .f:first-child{grid-column:1/-1}
  .ex-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ex-grid .f:first-child{grid-column:1/-1}

}

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=> (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,'').slice(0,16);
const pad2 = n=>String(n).padStart(2,'0');
const keyOf = d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const parseKey = k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const todayKey = ()=>keyOf(new Date());
const addDays = (k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d);};
const fmtLong = k=>parseKey(k).toLocaleDateString(undefined,{weekday:'long'});
const fmtShort = k=>parseKey(k).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const num = v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0;};
const fmtW = w=>{const r=Math.round(w*100)/100;return (r%1===0?r.toFixed(0):String(r));};
const e1rm = (w,r)=> r<=1? w : w*(1+r/30);
const SLOTS=[
  {id:'Wake',label:'On waking',time:'05:30'},
  {id:'Breakfast',label:'Breakfast',time:'07:15'},
  {id:'Mid-morning',label:'Mid-morning',time:'10:00'},
  {id:'Lunch',label:'Lunch',time:'12:00'},
  {id:'Pre-workout',label:'Pre-workout',time:'14:45'},
  {id:'Dinner',label:'Dinner',time:'18:00'},
  {id:'Night',label:'Evening',time:'20:45'},
  {id:'Bedtime',label:'Bedtime',time:'21:30'}];
const LEGACY={Morning:'Breakfast',Midday:'Lunch',Evening:'Dinner'};
const slotOf=s=>{const t=LEGACY[s.timing]||s.timing;return SLOTS.some(x=>x.id===t)?t:'Breakfast';};
const fmtClock=v=>{const m=/^(\d{1,2}):(\d{2})$/.exec(v||'');if(!m)return v||'';let h=+m[1];const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+m[2]+' '+ap;};
const slotTime=id=>((S.supps.slotTimes||{})[id])||SLOTS.find(x=>x.id===id).time;
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const KIND={rx:'Rx',inj:'Injection',supp:'Supplement',cardio:'Cardio'};
const CHECK='<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

/* ---------- phone app bridge + local storage (used only inside the Android app) ---------- */
const BRIDGE=window.AndroidBridge||null;
function localDB(){
  const KEY='sl.db'; let data={};
  try{data=JSON.parse(localStorage.getItem(KEY))||null;}catch(e){data=null;}
  if(!data){data=(window.SL_SEED&&window.SL_SEED.docs)?JSON.parse(JSON.stringify(window.SL_SEED.docs)):{};try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
  try{const sv=+(localStorage.getItem('sl.seedv')||0), seedP=window.SL_SEED&&window.SL_SEED.docs&&window.SL_SEED.docs['tracker/program'];
    if(seedP&&(seedP.seedVersion||1)>sv){const old=data['tracker/program'];const np=JSON.parse(JSON.stringify(seedP));
      if(old&&old.startDate)np.startDate=old.startDate; if(old&&old.name)np.name=old.name; data['tracker/program']=np;
      localStorage.setItem(KEY,JSON.stringify(data)); localStorage.setItem('sl.seedv',String(seedP.seedVersion||1));}}catch(e){}
  try{const ss=window.SL_SEED&&window.SL_SEED.docs&&window.SL_SEED.docs['tracker/supplements'], sv2=+(localStorage.getItem('sl.suppv')||0);
    if(ss&&(ss.seedVersion||1)>sv2){const cur=data['tracker/supplements'];
      if(cur&&Array.isArray(cur.items)){const have=new Set(cur.items.map(x=>x.id));for(const it of ss.items||[])if(it.addInSeed&&!have.has(it.id))cur.items.push(JSON.parse(JSON.stringify(it)));
        cur.slotTimes=Object.assign({},ss.slotTimes||{},cur.slotTimes||{});}
      localStorage.setItem(KEY,JSON.stringify(data)); localStorage.setItem('sl.suppv',String(ss.seedVersion||1));}}catch(e){}
  const subs=new Set();
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){} subs.forEach(f=>{try{f();}catch(e){}});};
  const meta={fromCache:false,hasPendingWrites:false};
  const snap=path=>{const v=data[path];return {id:path.split('/').pop(),exists:v!==undefined,data:()=>v,metadata:meta};};
  const docRef=path=>({path,id:path.split('/').pop(),
    get:async()=>snap(path),
    set:async d=>{data[path]=JSON.parse(JSON.stringify(d));persist();},
    update:async d=>{if(data[path]===undefined)throw {code:'invalid_argument',message:'missing'};data[path]=Object.assign({},data[path],JSON.parse(JSON.stringify(d)));persist();},
    delete:async()=>{delete data[path];persist();},
    onSnapshot(next){const f=()=>next(snap(path));subs.add(f);setTimeout(f,0);return()=>subs.delete(f);}});
  const query=(col,ord,lim)=>{
    const run=()=>{const depth=col.split('/').length+1;let docs=Object.keys(data).filter(p=>p.startsWith(col+'/')&&p.split('/').length===depth).map(snap);
      if(ord){const [f,dir]=ord;docs.sort((a,b)=>{const x=(a.data()||{})[f],y=(b.data()||{})[f];return (x<y?-1:x>y?1:0)*(dir==='desc'?-1:1);});}
      if(lim)docs=docs.slice(0,lim);return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:meta};};
    return {path:col,orderBy:(f,dir)=>query(col,[f,dir||'asc'],lim),limit:n=>query(col,ord,n),where:()=>query(col,ord,lim),
      get:async()=>run(),doc:id=>docRef(col+'/'+(id||uid())),add:async d=>{const r=docRef(col+'/'+uid());await r.set(d);return r;},
      onSnapshot(next){const f=()=>next(run());subs.add(f);setTimeout(f,0);return()=>subs.delete(f);}};};
  return {doc:docRef,collection:c=>query(c,null,0)};
}

/* ---------- state ---------- */
const S={
  db:null, dbState:'loading', readOnly:false, err:'',
  loaded:{supps:false,program:false,logs:false,workouts:false},
  supps:{items:[],example:false},
  program:{name:'',unit:'lb',days:[],example:false},
  logs:{}, workouts:[],
  tab:(lsGet('sl.tab')||'today'), date:todayKey(),
  session:lsGet('sl.session'), pickDay:null, progressEx:null,
  confirm:null, savedAt:0, saving:false
};
if(!['today','progress','setup'].includes(S.tab)) S.tab='today';

/* ---------- persistence ---------- */
const queues={};
function handleErr(e){
  const code=e&&e.code;
  if(code==='invalid_argument'){S.readOnly=true;S.err='This view can’t save changes. Open the tracker from your own account to log entries.';}
  else if(code==='quota_exceeded'){S.err='Storage is full. Delete some old workouts to keep logging.';}
  else S.err='Couldn’t save just now. Check your connection; your last change may not be stored.';
  render();
}
function write(path,data){
  if(!S.db||S.readOnly) return Promise.resolve();
  const prev=queues[path]||Promise.resolve();
  const p=prev.catch(()=>{}).then(()=>S.db.doc(path).set(data)).then(()=>{S.savedAt=Date.now();S.err='';tickSaved();}).catch(handleErr);
  queues[path]=p; return p;
}
function remove(path){
  if(!S.db||S.readOnly) return Promise.resolve();
  const prev=queues[path]||Promise.resolve();
  const p=prev.catch(()=>{}).then(()=>S.db.doc(path).delete()).catch(handleErr);
  queues[path]=p; return p;
}
const timers={};
function debounced(key,fn,ms=700){clearTimeout(timers[key]);S.saving=true;tickSaved();timers[key]=setTimeout(()=>{S.saving=false;fn();},ms);}
function saveSupps(){S.supps.example=false;debounced('supps',()=>write('tracker/supplements',clone(S.supps)));}
function saveProgram(now){S.program.example=false;const f=()=>write('tracker/program',clone(S.program));now?f():debounced('program',f);}
const clone=o=>JSON.parse(JSON.stringify(o));
function syncReminders(){
  if(!BRIDGE||!BRIDGE.setSchedule) return;
  try{BRIDGE.setSchedule(JSON.stringify({
    slots:SLOTS.map(x=>({id:x.id,label:x.label,time:slotTime(x.id)})),
    items:S.supps.items.filter(x=>x.active!==false&&x.name).map(x=>({name:x.name,dose:x.dose||'',slot:slotOf(x),days:Array.isArray(x.days)&&x.days.length?x.days:[0,1,2,3,4,5,6]}))}));}catch(e){}
}
function exportJSON(){
  const docs={'tracker/supplements':S.supps,'tracker/program':S.program};
  for(const k in S.logs) docs['supplog/'+k]=S.logs[k];
  for(const w of S.workouts) docs['workouts/'+w.id]=w;
  return JSON.stringify({app:'stack-and-lift',v:1,exported:new Date().toISOString(),docs});
}
async function importJSON(txt){
  let o=null; try{o=JSON.parse(txt);}catch(e){}
  if(!o||o.app!=='stack-and-lift'||!o.docs){S.ioMsg='That text isn’t a Stack & Lift backup. Copy everything from Export and paste it again.';render();return;}
  if(!S.db){S.ioMsg='Saving is off in this view, so nothing was imported.';render();return;}
  const ok=/^(tracker\/(supplements|program)|supplog\/[\w.-]+|workouts\/[\w.-]+)$/;
  const keep=new Set(Object.keys(o.docs).filter(p=>ok.test(p)));
  S.ioMsg='Importing…';render();
  for(const k in S.logs){const p='supplog/'+k;if(!keep.has(p))await remove(p);}
  for(const w of S.workouts){const p='workouts/'+w.id;if(!keep.has(p))await remove(p);}
  let n=0; for(const p of keep){await write(p,o.docs[p]);n++;}
  S.ioIn='';S.io=null;S.ioMsg='Imported '+n+' records.';render();
}
function backupHtml(){
  let h='<section class="section"><div class="sec-head"><h2>Backup &amp; sync</h2></div><div class="card pad" style="display:flex;flex-direction:column;gap:10px">';
  h+='<p class="muted" style="margin:0;font-size:13px">'+(BRIDGE?'This phone app keeps its own copy of your data. ':'')+'Export turns everything into one block of text. Paste it into Import on the other side (phone app or web tracker) to move your data across. Import replaces what’s there.</p>';
  if(BRIDGE){let st='';try{st=BRIDGE.notificationStatus();}catch(e){}
    h+='<div class="row"><span class="chip '+(st==='on'?'up':'hold')+'">Reminders '+(st==='on'?'on':'off')+'</span><button class="btn sm" data-act="notif-test">Send test reminder</button>'+(st==='on'?'':'<button class="btn sm" data-act="notif-settings">Turn on notifications</button>')+'</div>';}
  h+='<div class="row"><button class="btn" data-act="export">Export</button>'+(BRIDGE?'<button class="btn" data-act="share-export">Share backup</button>':'')+'<button class="btn" data-act="show-import">Import</button></div>';

  if(S.io==='import'){

function doSwap(rowId,name,perm){

function findEx(id){for(const d of S.program.days)for(const e of d.exercises)if(e.id===id)return e;return null;}
function nextDay(){const days=S.program.days;if(!days.length)return null;const last=S.workouts.find(w=>days.some(d=>d.id===w.dayId));if(!last)return days[0];const i=days.findIndex(d=>d.id===last.dayId);return days[(i+1)%days.length];}

function targetTxt(ex,unit){const reps=ex.repMin===ex.repMax?ex.repMin:ex.repMin+'–'+ex.repMax;return ex.sets+' × '+reps+(num(ex.weight)>0?' @ '+fmtW(ex.weight)+' '+unit:' · bodyweight');}
function plateMath(total,unit){
  const bar=unit==='kg'?20:45, set=unit==='kg'?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5];

const RESULT={logged:['top','Logged'],done:['up','Hit target'],miss:['hold','Missed reps'],cardio:['top','Cardio'],up:['up','↑ Add weight next time'],build:['build','Building reps'],hold:['hold','Missed reps · repeat'],deload:['deload','Deload 10%'],top:['top','Top of range']};
function evaluate(ex,sets){
  const n=ex.sets, w=num(ex.weight), inc=num(ex.increment);
  const logged=sets.filter(s=>s.r>0).slice(0,Math.max(n,1));
  const allTop=logged.length>=n&&logged.every(s=>s.w>=w-1e-9&&s.r>=ex.repMax);
  const anyMiss=logged.length<n||logged.some(s=>s.r<ex.repMin);
  let result,next=w,misses=ex.misses||0;
  if(allTop){ if(inc>0){result='up';next=w+inc;}else result='top'; misses=0;}
  else if(anyMiss){ misses++; if(misses>=3&&w>0){result='deload';next=inc>0?Math.max(0,Math.round(w*0.9/inc)*inc):Math.round(w*0.9*2)/2;misses=0;} else result='hold'; }
  else {result='build';misses=0;}
  return {result,next,misses};

function sessionHasReps(s){return !!s&&Object.values(s.entries||{}).some(rows=>(rows||[]).some(r=>String(r.r==null?'':r.r).trim()!==''));}
async function startSession(spec){

  if(spec.free){ss.mode='free';}else if(spec.week){ss.mode='per';ss.week=spec.week;ss.dow=spec.dow;}else ss.dayId=spec.dayId;

function persistSession(){lsSet('sl.session',S.session);}
async function finishSession(){
  const s=S.session; if(!s) return;
  const items=sessionItems(s); if(!items){S.session=null;persistSession();render();return;}
  const unit=S.program.unit, entries=[];
  for(const it of items){
    const sets=(s.entries[it.id]||[]).map(x=>({w:num(x.w),r:Math.round(num(x.r))})).filter(x=>x.r>0);

    if(it.assist){e.assist=true;e.target.assist=it.assist;}
    if(it.swappedFrom)e.swappedFrom=it.swappedFrom;

  }

  const doc={id:s.id,date:s.date,dayId:s.mode==='per'?('w'+s.week+'-'+s.dow):s.mode==='free'?'free':s.dayId,dayName:sessionTitle(s),unit,entries,
    minutes:Math.max(1,Math.round((Date.now()-s.startedAt)/60000)),createdAt:Date.now()};

  if(fut) h+='<div class="notice preview"><span><b>Preview.</b> This is what\'s planned for '+esc(parseKey(k).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}))+'. You can check items off and start the workout on the day.</span></div>';
  h+=startHero(k)+renderSuppToday(k)+renderTrainToday(k);
  return h;
}

function renderSuppToday(k){
  const act=dueOn(k), taken=dayLog(k).taken||{}, skipped=activeSupps().filter(s=>!onDay(s,k));
  let h='<section class="section" aria-labelledby="h-supp"><div class="sec-head"><h2 id="h-supp">Daily checklist</h2>';
  if(act.length){const n=act.filter(s=>taken[s.id]).length;
    h+='<div class="meter" style="flex:1;max-width:260px"><div class="meter-track"><div class="meter-fill" style="width:'+(100*n/act.length)+'%"></div></div><span class="num" style="font-weight:600">'+n+'/'+act.length+'</span></div>';}
  h+='</div>';
  if(!S.loaded.supps){return h+'<div class="card"><div class="skel"></div><div class="skel" style="width:60%"></div></div></section>';}
  if(!activeSupps().length) return h+'<div class="card empty"><b>No supplements yet</b><span>Add each vitamin, supplement, or medication with its dose and time of day, then check them off here.</span><button class="btn primary" data-goto="setup">Add supplements</button></div></section>';
  h+='<div class="card" style="padding-block:4px">';
  if(!act.length) h+='<div class="empty"><span>Nothing scheduled for this day.</span></div>';
  for(const sl of SLOTS){
    const g=act.filter(s=>slotOf(s)===sl.id); if(!g.length) continue;
    const done=g.every(s=>taken[s.id]);
    h+='<div class="group"><div class="group-h label" style="display:flex;justify-content:space-between;gap:8px"><span>'+esc(sl.label)+' · '+esc(fmtClock(slotTime(sl.id)))+'</span>'+(done?'<span style="color:var(--good)">Done</span>':'')+'</div>';
    for(const s of g){const on=!!taken[s.id];
      const chips=kindChip(s)+vialChip(s);
      h+='<button class="pill" data-act="take" data-id="'+esc(s.id)+'" aria-pressed="'+on+'"'+(k>todayKey()?' disabled':'')+'><span class="chk">'+CHECK+'</span><span class="pill-name">'+esc(s.name)+'<small>'+esc([s.dose,s.notes].filter(Boolean).join(' · '))+'</small>'+(s.caution?'<small class="caution">⚠ '+esc(s.caution)+'</small>':'')+(chips?'<span class="pill-chips">'+chips+'</span>':'')+'</span><span class="when">'+(on?esc(taken[s.id]===true?'✓':taken[s.id]):'')+'</span></button>';}
    h+='</div>';
  }
  h+='</div>';
  if(skipped.length) h+='<div class="muted" style="font-size:13px">Not scheduled '+(k===todayKey()?'today':'this day')+': '+esc(skipped.map(s=>s.name).join(', '))+'</div>';
  // week strip
  h+='<div class="week" aria-label="Last 7 days">';
  for(let i=6;i>=0;i--){const d=addDays(k,-i), f=dayFraction(d);
    h+='<div><span class="dot'+(d===todayKey()?' today':'')+'" title="'+esc(fmtShort(d))+': '+Math.round(f*100)+'%"><i style="height:'+(f*100)+'%"></i></span>'+esc(parseKey(d).toLocaleDateString(undefined,{weekday:'narrow'}))+'</div>';}
  h+='</div>';
  const st=streak(); if(st>1) h+='<div class="muted" style="font-size:13px">'+st+'-day streak of taking everything on your list.</div>';
  return h+'</section>';
}

function renderTrainToday(k){
  const unit=S.program.unit;
  let h='<section class="section" aria-labelledby="h-train"><div class="sec-head"><h2 id="h-train">Training</h2>';
  if(S.program.name) h+='<span class="label">'+esc(S.program.name)+'</span>';
  h+='</div>';
  if(!S.loaded.program) return h+'<div class="card"><div class="skel"></div><div class="skel" style="width:60%"></div></div></section>';
  if(S.session&&S.session.date===k) return h+renderSession()+'</section>';
  if(S.session&&S.session.date<k&&k===todayKey()) h+='<div class="notice"><span>You have an unsaved workout from <b>'+esc(parseKey(S.session.date).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}))+'</b> ('+esc(sessionTitle(S.session))+'). Open it to save or discard. Starting today\'s workout saves any sets you logged there.</span><button class="btn sm" data-act="open-stale">Open it</button></div>';
  const done=S.workouts.filter(w=>w.date===k);
  for(const w of done) h+=renderWorkoutSummary(w);
  if(isPer()) return h+renderPerToday(k,done)+'</section>';
  if(!S.program.days.length) return h+'<div class="card empty"><b>No training program yet</b><span>Set up your training days and lifts with sets, rep range, and starting weight. The app raises the weight when you hit the top of the range.</span><button class="btn primary" data-goto="setup">Build program</button></div></section>';
  const nd=S.program.days.find(d=>d.id===S.pickDay)||nextDay();
  h+='<div class="card"><div class="pad next"><div class="sec-head"><div><div class="label">'+(done.length?'Another session':'Next up')+'</div><h3 style="font-size:26px">'+esc(nd.name)+'</h3></div>';
  if(S.program.days.length>1){h+='<select class="inp" id="pickday" data-act="pickday" style="width:auto;font-family:var(--body);font-size:14px" aria-label="Choose training day">'+S.program.days.map(d=>'<option value="'+esc(d.id)+'"'+(d.id===nd.id?' selected':'')+'>'+esc(d.name)+'</option>').join('')+'</select>';}
  h+='</div><div class="ex-list">';
  for(const ex of nd.exercises){const last=lastFor(ex.id);
    h+='<div class="ex-line"><div style="min-width:0"><div style="font-weight:600">'+esc(ex.name)+'</div>'+platesHtml(ex,unit)+'</div><div style="text-align:right"><div class="target">'+esc(targetTxt(ex,unit))+'</div>'+(last?'<div class="muted" style="font-size:12px">Last: '+esc(last.e.sets.map(s=>s.r).join(', '))+' reps</div>':'')+'</div></div>';}
  if(!nd.exercises.length) h+='<div class="muted">No exercises on this day yet.</div>';
  if(k>todayKey()) return h+'</div><div class="muted" style="font-size:13px">Preview only. You can start sessions on the day.</div></div></div></section>';
  h+='</div><div class="row"><button class="btn primary big" data-act="start" data-id="'+esc(nd.id)+'"'+(nd.exercises.length?'':' disabled')+'>Start '+esc(nd.name)+'</button><button class="btn ghost" data-act="start-free">Empty session</button></div></div></div>';
  return h+'</section>';
}

function renderPerToday(k,done){
  const unit=S.program.unit, n=perWeekNum(k), total=perWeeks().length, dow=parseKey(k).getDay();
  if(!S.program.startDate) return '<div class="card empty"><b>Set a start date</b><span>Pick the Monday that starts week 1.</span><button class="btn primary" data-goto="setup">Open Setup</button></div>';
  if(n<1) return '<div class="card empty"><b>Program starts '+esc(fmtShort(S.program.startDate))+'</b></div>';
  if(n>total) return '<div class="card empty"><b>Program complete</b><span>All '+total+' weeks are done. Your results are on the Progress tab.</span></div>';
  const w=perWeek(n);
  let h='<div class="weekbar" aria-label="Week '+n+' of '+total+'">'+perWeeks().map(x=>'<i class="'+(x.week<n?'past':x.week===n?'now':'')+'" title="Week '+x.week+' · '+esc(x.phase)+'"></i>').join('')+'</div>';
  const pick=(S.pickDay!=null&&w.days.some(d=>String(d.dow)===String(S.pickDay)))?+S.pickDay:null;
  let d=w.days.find(x=>x.dow===(pick!=null?pick:dow))||null;
  const rest=!d;
  if(!d&&dow!==0) d=w.days.find(x=>x.dow>dow)||null;
  h+='<div class="card"><div class="pad next"><div class="sec-head"><div><div class="label">Week '+n+' of '+total+' · '+esc(w.phase)+(rest?' · rest day':'')+'</div><h3 style="font-size:26px">'+(d?(rest?'Next: ':'')+esc(DOW[d.dow]+' · '+d.name):'Rest day')+'</h3></div>';
  h+='<select class="inp" id="pickday" style="width:auto;font-family:var(--body);font-size:14px" aria-label="Choose session">'+w.days.map(x=>'<option value="'+x.dow+'"'+(d&&x.dow===d.dow?' selected':'')+'>'+DOW[x.dow]+' · '+esc(x.name)+'</option>').join('')+'</select></div>';
  if(!d) return h+'<div class="muted">No more sessions this week. Week '+(n+1)+' starts tomorrow.</div>'+(k>todayKey()?'':'<div><button class="btn" data-act="start-free">Start an empty session</button></div>')+'</div></div>';
  h+='<div class="ex-list">';
  for(const it of d.items){const last=it.cardioMin?null:lastFor(it.key);
    h+='<div class="ex-line"><div style="min-width:0"><div style="font-weight:600">'+esc(it.name)+'</div>'+platesHtml(it,unit)+(it.notes?'<div class="muted" style="font-size:12px">'+esc(it.notes)+'</div>':'')+'</div><div style="text-align:right"><div class="target">'+esc(perTarget(it,unit))+'</div>'+(last?'<div class="muted" style="font-size:12px">Last: '+esc(last.e.sets.map(x=>fmtW(x.w)+'×'+x.r).join(', '))+'</div>':'')+'</div></div>';}
  if(k>todayKey()){const sd=rest?null:d;h+='</div><div class="muted" style="font-size:13px">Preview only. '+(rest?'Rest day. ':'')+'Start this session on '+esc(parseKey(rest?addDays(k,d.dow-dow):k).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}))+'.</div></div></div>';return h;}
  const didIt=(done||[]).some(x=>x.dayId==='w'+n+'-'+d.dow);
  if(didIt) h+='</div><div class="row"><span class="chip up">✓ Done today</span><button class="btn ghost" data-act="start-per" data-wk="'+n+'" data-dow="'+d.dow+'">Log it again</button><button class="btn ghost" data-act="start-free">Empty session</button></div></div></div>';
  else h+='</div><div class="row"><button class="btn primary big" data-act="start-per" data-wk="'+n+'" data-dow="'+d.dow+'">Start '+esc(DOW[d.dow])+' session</button><button class="btn ghost" data-act="start-free">Empty session</button></div></div></div>';
  return h;
}

function renderSession(){
  const s=S.session, unit=S.program.unit, items=sessionItems(s);
  if(!items) return '<div class="card empty"><b>This training day isn’t in your program anymore.</b><button class="btn" data-act="discard-yes">Clear session</button></div>';
  let h='<div class="card"><div class="pad" style="border-bottom:1px solid var(--line)"><div class="label">In progress · '+esc(s.date===todayKey()?'today':fmtShort(s.date))+'</div><h3 style="font-size:26px">'+esc(sessionTitle(s))+'</h3></div>';
  for(const it of items){
    const rows=s.entries[it.id]||(s.entries[it.id]=[{w:it.wPre,r:'',done:false}]);
    const last=it.cardio?null:lastFor(it.key);
    h+='<div class="ex-card"><div class="ex-top"><div style="min-width:0"><h3>'+esc(it.name)+'</h3>'+platesHtml(it,unit)+'</div><div style="text-align:right"><div class="target">'+(it.extra?'<button class="btn sm ghost danger" data-act="rm-extra" data-id="'+esc(it.id)+'">Remove</button>':esc(it.target)+'<div><button class="btn sm ghost" data-act="swap-open" data-id="'+esc(it.id)+'" aria-expanded="'+(S.swapFor===it.id)+'">Swap</button></div>')+'</div>'+(last?'<div class="muted" style="font-size:12px">Last: '+esc(last.e.sets.map(x=>fmtW(x.w)+'×'+x.r).join(', '))+'</div>':'')+'</div></div>';
    if(it.notes) h+='<div class="muted" style="font-size:13px">'+esc(it.notes)+'</div>';
    if(S.swapFor===it.id&&!it.extra) h+=swapPanel(it,items);
    if(it.cardio){
      h+='<div class="sets" style="grid-template-columns:minmax(0,1fr) 44px"><input class="inp" id="r-'+it.id+'-0" inputmode="numeric" data-in="r" data-ex="'+it.id+'" data-i="0" value="'+esc(rows[0].r)+'" placeholder="'+it.cardioMin+' minutes" aria-label="'+esc(it.name)+' minutes"><button class="done" data-act="setdone" data-ex="'+it.id+'" data-i="0" aria-pressed="'+!!rows[0].done+'" aria-label="Mark cardio done">'+CHECK+'</button></div></div>';
      continue;}
    h+='<div class="sets"><span class="h">Set</span><span class="h">'+esc(it.wLabel)+'</span><span class="h">Reps</span><span></span>';
    rows.forEach((r,i)=>{
      h+='<span class="setn">'+(i+1)+'</span><input class="inp" id="w-'+it.id+'-'+i+'" inputmode="decimal" data-in="w" data-ex="'+it.id+'" data-i="'+i+'" value="'+esc(r.w)+'" aria-label="'+esc(it.name)+' set '+(i+1)+' '+esc(it.wLabel)+'"><input class="inp" id="r-'+it.id+'-'+i+'" inputmode="numeric" data-in="r" data-ex="'+it.id+'" data-i="'+i+'" value="'+esc(r.r)+'" placeholder="'+esc(it.repPh)+'" aria-label="'+esc(it.name)+' set '+(i+1)+' reps"><button class="done" data-act="setdone" data-ex="'+it.id+'" data-i="'+i+'" aria-pressed="'+!!r.done+'" aria-label="Mark set '+(i+1)+' done">'+CHECK+'</button>';
    });
    h+='</div><div class="row"><button class="btn sm ghost" data-act="addset" data-ex="'+it.id+'">+ Add set</button>'+(rows.length>1?'<button class="btn sm ghost" data-act="rmset" data-ex="'+it.id+'">Remove last set</button>':'')+'</div></div>';
  }
  const names=new Set(['Leg Extension','Leg Curl','Trap Bar Deadlift','Trap Bar Farmer Carry','Trap Bar Shrug','Landmine Press','Landmine Squat','Landmine Meadows Row','Back Extension','Ab Wheel Rollout','Stability Ball Hamstring Curl','Stability Ball Crunch','Hanging Leg Raise','Parallel Bar Dip','Chin-Up','Dumbbell Curl','Hammer Curl','Dumbbell Lateral Raise','Dumbbell Bench Press','Incline Dumbbell Press','Dumbbell Shoulder Press','Goblet Squat','Dumbbell Lunge','Bulgarian Split Squat','Barbell Hip Thrust','Deadlift','Barbell Curl','Close-Grip Bench Press','Dumbbell Shrug','Farmer Carry','Push-Up','Dip','Pull-Up']);
  for(const w of perWeeks())for(const d of w.days)for(const it of d.items)if(!it.cardioMin)names.add(it.name);
  for(const w of S.workouts)for(const e of w.entries||[])if(!e.cardio)names.add(e.name);
  h+='<div class="ex-card" style="background:var(--sunk)"><label class="label" for="add-ex-name">Add an exercise</label><div class="row"><input class="inp" id="add-ex-name" list="ex-suggest" placeholder="Type or pick, e.g. Hammer Curl" autocomplete="off" style="flex:1;min-width:170px;font-family:var(--body)"><input class="inp" id="add-ex-sets" inputmode="numeric" value="3" aria-label="Number of sets" style="width:64px"><button class="btn" data-act="add-extra">Add</button></div><datalist id="ex-suggest">'+[...names].sort().map(n=>'<option value="'+esc(n)+'"></option>').join('')+'</datalist><span class="muted" style="font-size:12px">Name, then number of sets. It’s logged with today’s workout and shows up in Progress.</span></div>';
  h+='<div class="foot">';
  if(S.confirm==='discard') h+='<div class="confirm"><span>Discard this session?</span><button class="btn sm danger" data-act="discard-yes">Discard</button><button class="btn sm" data-act="cancel-confirm">Keep</button></div>';
  else h+='<button class="btn ghost" data-act="discard">Discard</button>';
  h+='<button class="btn primary" data-act="finish">Finish &amp; save</button></div></div>';
  h+='<p class="muted" style="font-size:13px;margin:0">'+(s.mode==='per'?'Weights come from your 12-week plan. For RPE and self-select lifts, enter the load you used. For assisted chin-ups, enter the assistance.':'Hit the top of the rep range on every set and the weight goes up next time. Three sessions in a row below the range triggers a 10% deload.')+'</p>';
  return h;
}

function renderWorkoutSummary(w){
  let h='<div class="card"><div class="pad" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline"><div><div class="label">Logged'+(w.minutes?' · '+w.minutes+' min':'')+'</div><h3 style="font-size:24px">'+esc(w.dayName)+'</h3></div></div>';
  for(const e of w.entries||[]){const r=RESULT[e.result]||RESULT.build;
    h+='<div class="summary-line"><div style="font-weight:600;min-width:0">'+esc(e.name)+'</div><span class="chip '+r[0]+'">'+esc(r[1])+'</span><div class="s">'+esc(e.cardio?e.sets[0].r+' min':(e.assist?'assist ':'')+e.sets.map(x=>fmtW(x.w)+'×'+x.r).join('  '))+'</div><div class="s" style="text-align:right">'+(e.result==='up'||e.result==='deload'?'Next: '+fmtW(e.nextWeight)+' '+esc(w.unit):'')+'</div></div>';}
  return h+'</div>';
}

/* ---------- progress ---------- */
function renderProgress(){
  const unit=S.program.unit;
  let h='';
  const allEx=[];const seen=new Set();
  for(const d of S.program.days)for(const e of d.exercises){if(!seen.has(e.id)){seen.add(e.id);allEx.push({id:e.id,name:e.name});}}
  for(const w of S.workouts)for(const e of w.entries||[]){if(!seen.has(e.exId)){seen.add(e.exId);allEx.push({id:e.exId,name:e.name});}}
  const logged=allEx.filter(x=>S.workouts.some(w=>(w.entries||[]).some(e=>e.exId===x.id&&!e.cardio&&!e.assist&&e.sets.some(z=>z.w>0))));
  if(!S.progressEx||!logged.some(x=>x.id===S.progressEx)) S.progressEx=(logged.find(x=>x.id==='competition-bench-press')||logged[0]||{}).id||null;

  // headline stats
  const last30=S.workouts.filter(w=>w.date>addDays(todayKey(),-30)).length;
  let adh=0,days=0;for(let i=0;i<30;i++){const k=addDays(todayKey(),-i);if(activeSupps().length){adh+=dayFraction(k);days++;}}
  h+='<section class="section"><h2>Last 30 days</h2><div class="stats"><div><span class="label">Workouts</span><b class="num">'+last30+'</b></div><div><span class="label">Supplements taken</span><b class="num">'+(days?Math.round(100*adh/days):0)+'%</b></div><div><span class="label">Streak</span><b class="num">'+streak()+'<span style="font-size:16px"> days</span></b></div></div></section>';

  // lift chart
  h+='<section class="section"><div class="sec-head"><h2>Lift progression</h2></div>';
  if(!logged.length){h+='<div class="card empty"><b>No workouts logged yet</b><span>Finish a session on the Today tab and each lift’s working weight and estimated one-rep max will chart here.</span></div></section>';}
  else{
    h+='<div class="chips">'+logged.map(x=>'<button data-act="pex" data-id="'+esc(x.id)+'" aria-pressed="'+(x.id===S.progressEx)+'">'+esc(x.name)+'</button>').join('')+'</div>';
    const pts=[];for(const w of S.workouts.slice().reverse()){const e=(w.entries||[]).find(z=>z.exId===S.progressEx&&!z.cardio);if(!e)continue;
      const top=Math.max(...e.sets.map(s=>s.w)), best=Math.max(...e.sets.map(s=>e1rm(s.w,s.r)));
      pts.push({date:w.date,top,e1:best,sets:e.sets,result:e.result,unit:w.unit});}
    h+='<div class="card pad">'+chart(pts,unit)+'<div class="legend"><span><i style="background:var(--accent)"></i>Top set weight</span><span><i style="background:var(--muted)"></i>Estimated 1RM (Epley)</span></div></div>';
    h+='<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Sets</th><th>Est. 1RM</th><th>Result</th></tr></thead><tbody>';
    for(const p of pts.slice().reverse().slice(0,12)){const r=RESULT[p.result]||RESULT.build;
      h+='<tr><td>'+esc(fmtShort(p.date))+'</td><td class="m">'+esc(p.sets.map(s=>fmtW(s.w)+'×'+s.r).join('  '))+'</td><td class="m">'+fmtW(Math.round(p.e1))+' '+esc(p.unit)+'</td><td><span class="chip '+r[0]+'">'+esc(r[1])+'</span></td></tr>';}
    h+='</tbody></table></div></div></section>';
  }

  // supplement calendar
  h+='<section class="section"><h2>Supplement consistency</h2>';
  if(!activeSupps().length) h+='<div class="card empty"><b>No supplements on your list</b><button class="btn" data-goto="setup">Add supplements</button></div>';
  else{
    const end=todayKey(), dow=(parseKey(end).getDay()+6)%7; // Monday-aligned, last 4 weeks through today
    const start=addDays(end,-(21+dow));
    h+='<div class="card pad"><div class="cal">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>'<div class="h">'+d+'</div>').join('');
    for(let k=start;k<=end;k=addDays(k,1)){const f=dayFraction(k);
      h+='<div class="c'+(f>=1?' full':'')+'" title="'+esc(fmtShort(k))+': '+Math.round(f*100)+'%"><i style="opacity:'+(f*0.85)+'"></i><span class="num">'+parseKey(k).getDate()+'</span></div>';}
    h+='</div></div>';
    h+='<div class="card pad bars">';
    for(const s of activeSupps()){let n=0,due=0;for(let i=0;i<30;i++){const dk=addDays(end,-i);if(!onDay(s,dk))continue;due++;if((dayLog(dk).taken||{})[s.id])n++;}
      h+='<div class="b"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(s.name)+'</span><span class="t"><i style="width:'+(due?100*n/due:0)+'%"></i></span><span class="num muted" style="text-align:right">'+n+'/'+due+'</span></div>';}
    h+='</div>';
  }
  h+='</section>';

  // history
  h+='<section class="section"><h2>Workout history</h2>';
  if(!S.workouts.length) h+='<div class="card empty"><span>Your finished sessions will list here.</span></div>';
  else{h+='<div class="card hist">';
    for(const w of S.workouts.slice(0,40)){
      h+='<div class="hist-item"><div class="sec-head"><div><b>'+esc(w.dayName)+'</b> <span class="muted">· '+esc(parseKey(w.date).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}))+'</span></div>';
      if(S.confirm==='del:'+w.id) h+='<div class="confirm"><span>Delete this workout?</span><button class="btn sm danger" data-act="delw-yes" data-id="'+esc(w.id)+'">Delete</button><button class="btn sm" data-act="cancel-confirm">Keep</button></div>';
      else h+='<button class="btn sm ghost" data-act="delw" data-id="'+esc(w.id)+'">Delete</button>';
      h+='</div><div class="muted" style="font-size:13px">'+esc((w.entries||[]).map(e=>e.cardio?'Zone 2 '+e.sets[0].r+' min':e.name+' '+fmtW(Math.max(...e.sets.map(s=>s.w)))+'×'+e.sets.map(s=>s.r).join('/')).join(' · '))+'</div></div>';}
    h+='</div><p class="muted" style="font-size:13px;margin:0">Deleting a workout removes it from history; it doesn’t change your current working weights. Adjust those in Setup.</p>';}
  return h+'</section>';
}

function nice(lo,hi,n){const span=hi-lo||1;const step0=span/n;const mag=Math.pow(10,Math.floor(Math.log10(step0)));const err=step0/mag;const step=(err>=7.5?10:err>=3.5?5:err>=1.5?2:1)*mag;return {lo:Math.floor(lo/step)*step,hi:Math.ceil(hi/step)*step,step};}
function chart(pts,unit){
  if(pts.length<2) return '<div class="empty" style="padding:28px 8px"><span>Log this lift '+(pts.length?'once more':'twice')+' to see a trend line.</span>'+(pts.length?'<b class="num">'+fmtW(pts[0].top)+' '+esc(unit)+' top set</b>':'')+'</div>';
  const W=640,H=240,L=46,R=14,T=14,B=30;
  const t0=parseKey(pts[0].date).getTime(), t1=parseKey(pts[pts.length-1].date).getTime()||t0+1;
  const ys=pts.flatMap(p=>[p.top,p.e1]); const sc=nice(Math.min(...ys)*0.95,Math.max(...ys)*1.02,4);
  const x=t=>L+(W-L-R)*((t-t0)/((t1-t0)||1)), y=v=>T+(H-T-B)*(1-(v-sc.lo)/((sc.hi-sc.lo)||1));
  let g='';
  for(let v=sc.lo;v<=sc.hi+1e-9;v+=sc.step){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+fmtW(v)+'</text>';}
  const ticks=Math.min(5,pts.length); for(let i=0;i<ticks;i++){const p=pts[Math.round(i*(pts.length-1)/Math.max(1,ticks-1))];const tx=x(parseKey(p.date).getTime());g+='<text x="'+tx+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':i===ticks-1?'end':'middle')+'">'+esc(fmtShort(p.date))+'</text>';}
  const line=(key)=>pts.map((p,i)=>(i?'L':'M')+x(parseKey(p.date).getTime()).toFixed(1)+' '+y(p[key]).toFixed(1)).join(' ');
  const area=line('top')+' L'+x(t1).toFixed(1)+' '+(H-B)+' L'+x(t0).toFixed(1)+' '+(H-B)+' Z';
  const lp=pts[pts.length-1], lx=x(t1), ly=y(lp.top);
  g+='<path d="'+area+'" fill="var(--accent)" fill-opacity=".10"/>';
  g+='<path d="'+line('e1')+'" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>';
  g+='<path d="'+line('top')+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  g+=pts.map(p=>'<circle cx="'+x(parseKey(p.date).getTime())+'" cy="'+y(p.top)+'" r="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>').join('');
  g+='<circle cx="'+lx+'" cy="'+ly+'" r="5.5" fill="var(--accent)"/>';
  g+='<text x="'+(lx-8)+'" y="'+(ly-10)+'" text-anchor="end" style="fill:var(--ink);font-weight:500">'+fmtW(lp.top)+' '+esc(unit)+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Top set weight over time">'+g+'</svg>';
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-goto],[data-act]'); if(!t) return;
  if(t.matches('select')) return;
  if(t.dataset.tab||t.dataset.goto){S.tab=t.dataset.tab||t.dataset.goto;S.confirm=null;lsSet('sl.tab',S.tab);render();window.scrollTo({top:0});return;}
  const a=t.dataset.act, id=t.dataset.id;
  switch(a){
    case 'dismiss-err': S.err='';render();break;
    case 'export': S.io='export';S.ioText=exportJSON();S.ioMsg='';render();break;
    case 'share-export': try{BRIDGE.share(exportJSON());}catch(e){}break;
    case 'show-import': S.io='import';S.ioMsg='';render();break;
    case 'copy-export': {const ta=$('#io-out'),m=$('#copymsg');const ok=()=>{if(m)m.textContent='Copied';};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(S.ioText).then(ok,()=>{if(ta){ta.focus();ta.select();}if(m)m.textContent='Select all and copy';});}
      else if(ta){ta.focus();ta.select();if(m)m.textContent='Select all and copy';}break;}
    case 'do-import': if((S.ioIn||'').trim()){S.confirm='import';render();}break;
    case 'import-yes': S.confirm=null;importJSON(S.ioIn||'');break;
    case 'notif-test': try{BRIDGE.testNotification();}catch(e){}break;
    case 'notif-settings': try{BRIDGE.openNotificationSettings();}catch(e){}break;
    case 'day': {const n=+t.dataset.n;S.date=addDays(S.date,n);S.pickDay=null;S.confirm=null;render();break;}
    case 'today': S.date=todayKey();S.pickDay=null;render();break;
    case 'take': toggleTake(id);break;
    case 'start': startSession({dayId:id}).then(scrollTrain);break;
    case 'start-per': startSession({week:+t.dataset.wk,dow:+t.dataset.dow}).then(scrollTrain);break;
    case 'open-stale': if(S.session){S.date=S.session.date;S.pickDay=null;render();scrollTrain();}break;
    case 'goto-train': scrollTrain();break;
    case 'start-free': startSession({free:true});break;
    case 'add-extra': {const ni=$('#add-ex-name'),si=$('#add-ex-sets');const name=(ni&&ni.value||'').trim();if(!name){if(ni)ni.focus();break;}
      const sets=Math.min(10,Math.max(1,Math.round(num(si&&si.value)||3)));const x={id:'x'+uid(),key:slugify(name),name,sets};
      S.session.extras=(S.session.extras||[]).concat(x);S.session.entries[x.id]=Array.from({length:sets},()=>({w:'',r:'',done:false}));
      persistSession();render();const el=$('#w-'+x.id+'-0');if(el)el.focus();break;}
    case 'swap-open': S.swapFor=(S.swapFor===id?null:id);render();break;
    case 'swap-undo': if(S.session.swaps)delete S.session.swaps[id];S.swapFor=null;persistSession();render();break;
    case 'do-swap': doSwap(id,t.dataset.name||'',!!($('#swap-all')&&$('#swap-all').checked));break;
    case 'swap-custom': {const el=$('#swap-name');const nm=(el&&el.value||'').trim();if(!nm){if(el)el.focus();break;}doSwap(id,nm,!!($('#swap-all')&&$('#swap-all').checked));break;}
    case 'rm-extra': {S.session.extras=(S.session.extras||[]).filter(x=>x.id!==id);delete S.session.entries[id];persistSession();render();break;}
    case 'setdone': {const r=S.session.entries[t.dataset.ex][+t.dataset.i];const it=(sessionItems(S.session)||[]).find(x=>x.id===t.dataset.ex);
      r.done=!r.done; if(r.done&&!String(r.r).trim()&&it&&it.repFill>0){r.r=it.repFill;const ri=$('#r-'+t.dataset.ex+'-'+t.dataset.i);if(ri)ri.value=r.r;}
      t.setAttribute('aria-pressed',String(r.done)); persistSession(); if(r.done&&it&&!it.cardio)startRest(90); break;}
    case 'addset': {const rows=S.session.entries[t.dataset.ex];const lastR=rows[rows.length-1];rows.push({w:lastR?lastR.w:'',r:'',done:false});persistSession();render();break;}
    case 'rmset': {S.session.entries[t.dataset.ex].pop();persistSession();render();break;}
    case 'finish': finishSession();break;
    case 'discard': S.confirm='discard';render();break;
    case 'discard-yes': S.session=null;S.confirm=null;persistSession();wake(false);stopRest();render();break;
    case 'cancel-confirm': S.confirm=null;render();break;
    case 'rest-add': if(rest){rest.end+=30000;drawRest();}break;
    case 'rest-stop': stopRest();break;
    case 'pex': S.progressEx=id;render();break;
    case 'delw': S.confirm='del:'+id;render();break;
    case 'delw-yes': S.workouts=S.workouts.filter(w=>w.id!==id);S.confirm=null;render();remove('workouts/'+id);break;
    case 'sday': {const s=S.supps.items.find(x=>x.id===id);if(s){const d=+t.dataset.d;let days=Array.isArray(s.days)&&s.days.length?s.days.slice():[0,1,2,3,4,5,6];days=days.includes(d)?days.filter(x=>x!==d):days.concat(d).sort();if(!days.length)break;s.days=days.length===7?[]:days;t.setAttribute('aria-pressed',String(days.includes(d)));saveSupps();}break;}
    case 'add-supp': S.supps.items.push({id:uid(),name:'',dose:'',timing:'Breakfast',kind:'supp',days:[],notes:'',caution:'',active:true});saveSupps();render();{const l=S.supps.items[S.supps.items.length-1];const el=$('#sn-'+l.id);if(el)el.focus();}break;
    case 'rm-supp': S.supps.items=S.supps.items.filter(s=>s.id!==id);saveSupps();render();break;
    case 'add-day': S.program.days.push({id:uid(),name:'Day '+(S.program.days.length+1),exercises:[]});saveProgram();render();break;
    case 'rm-day': S.confirm='rmday:'+id;render();break;
    case 'rm-day-yes': S.program.days=S.program.days.filter(d=>d.id!==id);S.confirm=null;saveProgram();render();break;
    case 'add-ex': {const d=S.program.days.find(x=>x.id===id);if(d){const ex={id:uid(),name:'',sets:3,repMin:8,repMax:12,weight:0,increment:5,barbell:false,misses:0};if(S.program.unit==='kg')ex.increment=2.5;d.exercises.push(ex);saveProgram();render();const el=$('#en-'+ex.id);if(el)el.focus();}break;}
    case 'rm-ex': for(const d of S.program.days)d.exercises=d.exercises.filter(x=>x.id!==id);saveProgram();render();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='swap-name'){e.preventDefault();const b=document.querySelector('[data-act="swap-custom"]');if(b)b.click();return;}if(e.key==='Enter'&&(e.target.id==='add-ex-name'||e.target.id==='add-ex-sets')){e.preventDefault();const b=document.querySelector('[data-act="add-extra"]');if(b)b.click();}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='io-in'){S.ioIn=t.value;return;}
  if(t.dataset.in&&S.session){const r=S.session.entries[t.dataset.ex][+t.dataset.i];r[t.dataset.in]=t.value;persistSession();return;}
  if(t.dataset.slot){S.supps.slotTimes=Object.assign({},S.supps.slotTimes||{},{[t.dataset.slot]:t.value});saveSupps();return;}
  if(t.dataset.sf&&t.type!=='checkbox'&&t.tagName!=='SELECT'){const s=S.supps.items.find(x=>x.id===t.closest('[data-supp]').dataset.supp);if(s){s[t.dataset.sf]=t.value;saveSupps();}return;}
  if(t.dataset.ef&&t.type!=='checkbox'){const ex=findEx(t.closest('[data-ex]').dataset.ex);if(ex){const k=t.dataset.ef;ex[k]=k==='name'?t.value:(k==='weight'||k==='increment'?num(t.value):Math.max(k==='sets'?1:0,Math.round(num(t.value))));if(k==='repMin'&&ex.repMax<ex.repMin)ex.repMax=ex.repMin;saveProgram();}return;}
  if(t.dataset.df){const d=S.program.days.find(x=>x.id===t.closest('[data-day]').dataset.day);if(d){d.name=t.value;saveProgram();}return;}
  if(t.dataset.pf==='name'){S.program.name=t.value;saveProgram();return;}
  if(t.dataset.pf==='startDate'){if(t.value){S.program.startDate=t.value;saveProgram();}return;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pickday'){S.pickDay=t.value;render();return;}
  if(t.id==='jumpdate'){if(/^\d{4}-\d{2}-\d{2}$/.test(t.value)){S.date=t.value;S.pickDay=null;render();}return;}
  if(t.id==='setupweek'){S.setupWeek=+t.value;render();return;}
  if(t.dataset.sf==='timing'||t.dataset.sf==='active'||t.dataset.sf==='kind'){const s=S.supps.items.find(x=>x.id===t.closest('[data-supp]').dataset.supp);if(s){s[t.dataset.sf]=t.type==='checkbox'?t.checked:t.value;saveSupps();if(t.dataset.sf!=='active')render();}return;}
  if(t.dataset.ef==='barbell'){const ex=findEx(t.closest('[data-ex]').dataset.ex);if(ex){ex.barbell=t.checked;saveProgram();}return;}
  if(t.dataset.ef&&t.dataset.ef!=='name'){render();return;} // normalize displayed numbers
  if(t.dataset.pf==='unit'){S.program.unit=t.value;saveProgram();render();return;}
});

function toggleTake(id){
  if(S.date>todayKey()) return;
  const k=S.date, log=clone(dayLog(k)); log.date=k; log.taken=log.taken||{};
  if(log.taken[id]) delete log.taken[id];
  else { const now=new Date(); log.taken[id]= k===todayKey()? now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : '✓'; }
  S.logs[k]=log; render(); write('supplog/'+k,log);
}

let pending=false;
function softRender(){ if(editingSetup()||editingSession()){pending=true;return;} render(); }
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pending&&!editingSetup()&&!editingSession()){pending=false;render();}},0);});

render();
(async function(){
  let db=null;
  if(BRIDGE){ db=localDB(); }
  else { try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){db=null;} }
  if(!db){ S.dbState='none'; Object.keys(S.loaded).forEach(k=>S.loaded[k]=true); render(); return; }
  S.db=db; S.dbState='ok';
  const onErr=e=>{ if(e&&e.code!=='revoked'){S.err='Lost connection to your saved data. Reload the page to reconnect.';} Object.keys(S.loaded).forEach(k=>S.loaded[k]=true); render(); };
  db.doc('tracker/supplements').onSnapshot(snap=>{
    if(timers.supps&&S.saving) return;
    const d=snap.exists?snap.data():null; S.supps=d?clone(d):{items:[],example:false}; if(!Array.isArray(S.supps.items))S.supps.items=[];
    S.loaded.supps=true; syncReminders(); softRender();
  },onErr);
  db.doc('tracker/program').onSnapshot(snap=>{
    if(timers.program&&S.saving) return;
    const d=snap.exists?snap.data():null; S.program=d?clone(d):{name:'',unit:'lb',days:[],example:false}; if(!Array.isArray(S.program.days))S.program.days=[];
    S.loaded.program=true; softRender();
  },onErr);
  db.collection('supplog').orderBy('date','desc').limit(400).onSnapshot(q=>{
    const m={}; q.docs.forEach(d=>{const v=d.data();if(v&&v.date)m[v.date]=clone(v);}); S.logs=m; S.loaded.logs=true; softRender();
  },onErr);
  db.collection('workouts').orderBy('date','desc').limit(1000).onSnapshot(q=>{
    S.workouts=q.docs.map(d=>clone(d.data())).filter(w=>w&&w.date).sort(sortW); S.loaded.workouts=true; softRender();
  },onErr);
})();
})();
</script>
</body></html>
